<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Elke Dag Zin</title>
<meta name="description" content="Elke dag een beetje Vlaams: zinnen, woorden en herhalingen.">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dagzin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon192.png">
<link rel="apple-touch-icon" href="icon180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Work+Sans:wght@400;500;600&family=Pixelify+Sans:wght@500;700&display=swap">
<script>const APP_VERSION = "a79f7e09de";</script>
<style>
/* Colour has three jobs only:
   green  = you can tap this (filled = the one thing to do next)
   blue / red = de / het
   gold   = the verb (slot 2 and the verb end: the "verb bracket")
   Everything else is ink on white. */
:root{
  --bg:#FFFFFF; --ink:#1E1B16; --ink2:#6B665E; --faint:#A9A49A; --line:#E7E3DC; --soft:#F6F4F0;
  --go:#2F6B3A; --go-dark:#24542D; --go-tint:#EAF2EA;
  --de:#23408E; --het:#B03A2E; --de-tint:#E8ECF6; --het-tint:#F8E7E4;
  --verb:#8A5D10; --verb-fill:#F3E4C2; --verb-line:#C99A3A;
  --warn:#8A5A2B; --warn-tint:#F7EFE3;
  --display:'Fraunces', Georgia, 'Times New Roman', serif;
  --ui:'Work Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;font-variation-settings:'opsz' 72}
h1{font-size:28px} h2{font-size:22px} h3{font-size:18px}
.nl{font-family:var(--display);font-variation-settings:'opsz' 36}
.de{color:var(--de)} .het{color:var(--het)}
.small{font-size:13px;color:var(--ink2)}
.muted{color:var(--ink2)}
.label{font-size:13px;color:var(--ink2);font-weight:500}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
@supports (height:100dvh){#app{height:100dvh}}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(20px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) 32px calc(16px + env(safe-area-inset-left,0px))}
#tabs{display:flex;border-top:1px solid var(--line);background:var(--bg);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#tabs button{flex:1;border:0;background:transparent;padding:12px 2px 14px;font-size:13px;font-weight:500;color:var(--ink2);min-height:52px;-webkit-touch-callout:none;user-select:none;position:relative}
#tabs button.on{color:var(--ink)}
#tabs button.on::after{content:'';position:absolute;left:30%;right:30%;bottom:8px;height:2px;background:var(--ink);border-radius:1px}

.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.soft{background:var(--soft);border-color:var(--soft)}

/* buttons: green means tappable */
.btn{border:1.5px solid var(--go);background:var(--go);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;min-height:48px;-webkit-touch-callout:none}
.btn:active{background:var(--go-dark)}
.btn.line{background:var(--bg);color:var(--go)}
.btn.block{width:100%}
.btn.quiet{border-color:var(--line);background:var(--bg);color:var(--ink)}
.link{border:0;background:none;color:var(--go);font-weight:600;cursor:pointer;padding:10px 0;min-height:44px;text-align:left}
.tapline{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.tapline .t{flex:1;min-width:0}
.tapline .chev{color:var(--go);font-size:22px;line-height:1}
.back{border:0;background:none;color:var(--go);font-weight:600;cursor:pointer;padding:8px 0;min-height:44px;font-size:15px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;min-height:34px;color:var(--ink)}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--ink2)}
.pill.test{background:var(--warn-tint);color:var(--warn)}
.iconbtn{border:0;background:transparent;width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--go);outline-offset:2px}
button[disabled]{opacity:.45}
input[type=text],input[type=search],textarea,select{font:inherit;font-size:17px;width:100%;border:1px solid #CFCAC1;background:#fff;border-radius:10px;padding:11px 12px;color:var(--ink)}
input.big{font-family:var(--display);font-size:22px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}

/* today */
.hero{border:1.5px solid var(--go);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.dateline{font-size:14px;color:var(--ink2)}
.big-num{font-family:var(--display);font-size:32px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.weekbar{display:flex;gap:4px}
.weekbar span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.weekbar span.on{background:var(--ink)}

/* map */
.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.maptown{cursor:pointer}
.maptown text{font-family:var(--display)}

/* coach tips */
.tip{border-left:3px solid var(--go);background:var(--go-tint);border-radius:0 12px 12px 0;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.tip .link{padding:4px 0;min-height:32px;align-self:flex-start}
.howto{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}

/* overlays */
.overlay{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.overlay .ohead{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line)}
.overlay .obody{flex:1;overflow-y:auto;padding:20px 16px 32px;-webkit-overflow-scrolling:touch}
.overlay .obody > .inner{max-width:560px;margin:0 auto}
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(30,27,22,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 12px}
.progress{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress > div{height:100%;background:var(--ink);transition:width .3s}

/* exercises */
.ex-label:empty{display:none}
.ex-prompt{font-family:var(--display);font-size:24px;line-height:1.3;font-variation-settings:'opsz' 48}
.ex-sub{color:var(--ink2);font-size:15px}
.blank{display:inline-block;min-width:3em;border-bottom:2px solid var(--ink);color:transparent}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1.5px solid var(--go);background:var(--bg);color:var(--ink);border-radius:12px;padding:13px 14px;text-align:left;font-family:var(--display);font-size:19px;cursor:pointer;min-height:50px}
.opt[disabled]{opacity:1;border-color:var(--line)}
.opt.right{border-color:var(--go);background:var(--go-tint)}
.opt.wrong{border-color:var(--warn);background:var(--warn-tint);text-decoration:line-through}
.dehet{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dehet button{font-family:var(--display);font-size:26px;border-radius:12px;padding:16px;border:2px solid;cursor:pointer;background:var(--bg);min-height:64px}
.dehet .d{border-color:var(--de);color:var(--de)} .dehet .h{border-color:var(--het);color:var(--het)}
.dehet .d.pick{background:var(--de);color:#fff} .dehet .h.pick{background:var(--het);color:#fff}
.dehet button[disabled]{opacity:1}
.tokens{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:8px;border-radius:12px}
.tokens.answer{border:1.5px dashed #CFCAC1}
.tok{font-family:var(--display);font-size:18px;border:1.5px solid var(--go);background:var(--bg);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:44px;color:var(--ink)}
.tokens.answer .tok{border-color:var(--ink)}
.tok.used{visibility:hidden}
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--go-tint)}
.fb.no{background:var(--warn-tint)}
.fb h3{font-size:20px}
.fb .answer{font-family:var(--display);font-size:20px}
.why{font-size:15px;line-height:1.55}
.why i{font-family:var(--display)}
.speak{border:1.5px solid var(--go);background:var(--bg);color:var(--go);border-radius:50%;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.speak .ico-stop{display:none}.speak.playing{background:var(--go);color:#fff}.speak.playing .ico-play{display:none}.speak.playing .ico-stop{display:block}

/* sentence frame: gold = the verb bracket */
.frame{display:flex;flex-wrap:wrap;gap:4px;font-size:14px}
.frame .slot{display:flex;flex-direction:column;gap:3px;min-width:56px;flex:1 1 auto}
.frame .slot .lab{font-size:11px;color:var(--ink2);padding-left:2px}
.frame .slot .box{border-radius:8px;padding:7px 8px;font-family:var(--display);font-size:16px;min-height:36px;background:var(--soft)}
.frame .s2 .box,.frame .s4 .box{background:var(--verb-fill);color:var(--verb);box-shadow:inset 0 0 0 1.5px var(--verb-line)}
.frame .empty .box{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--faint);font-family:var(--ui);font-size:12px}
.frame .subj,.subj{font-weight:700}
/* underline means one thing only: tap for the word card (.rw) */
u{text-decoration:none}
.verbword{color:var(--verb);font-weight:600}

/* word card */
.wc-word{font-family:var(--display);font-size:34px;font-weight:600;line-height:1.1;font-variation-settings:'opsz' 96}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:0}
.kv dt{color:var(--ink2)} .kv dd{margin:0;font-family:var(--display)}
.conj{width:100%;border-collapse:collapse;font-size:15px}
.conj td{padding:6px 4px;border-bottom:1px solid var(--line)}
.conj td:first-child{color:var(--ink2);width:44%}
.conj td:last-child{font-family:var(--display);font-size:17px;color:var(--verb)}
.conj .head td{color:var(--ink);font-weight:600;font-family:var(--ui);font-size:13px;padding-top:12px;border-bottom:0}
.en-hidden{border:1.5px dashed var(--go);border-radius:8px;padding:6px 10px;background:transparent;color:var(--go);cursor:pointer;font-size:14px;font-weight:500}
.list .li{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer;min-height:48px}
.list .li .w{font-family:var(--display);font-size:18px}
.list .li .d{font-size:13px;color:var(--ink2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.flash{min-height:300px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;cursor:pointer;border:1.5px solid var(--go)}

.bar{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--ink)}
.bar.soon{color:var(--faint)}
.bar .num{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink2)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.switch input{width:22px;height:22px;accent-color:var(--go)}

/* tour */
.tour{display:flex;flex-direction:column;gap:18px;padding-top:12px}
.tour .dots{display:flex;gap:6px;justify-content:center}
.tour .dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tour .dots span.on{background:var(--ink)}
.tour svg{width:100%;height:auto;max-height:220px}

/* feed */
#feed{position:fixed;inset:0;z-index:35;background:var(--soft)}
#feed .fhead{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;pointer-events:none}
#feed .fhead > *{pointer-events:auto}
#feed .fscroll{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.fcard{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:64px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.fcard .fin{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;min-height:56%;justify-content:center;border:1px solid var(--line);max-height:100%;overflow-y:auto;transition:transform .28s ease-in,opacity .28s ease-in,border-color .15s}
/* 2.11: a card never grows past its own screen; a verb overview is compact; Wist ik / Nog niet sends the card sideways */
.fcard .fin{justify-content:flex-start} .fcard .fin > *{flex-shrink:0} .fcard .fin > :first-child{margin-top:auto} .fcard .fin > :last-child{margin-bottom:auto} /* centred, but never cut off at the top */
.fcard .conj + .why{display:none} /* the long verb note stays on the word card */
.fcard .conj td{padding:3px 4px} .fcard .conj td:last-child{font-size:16px} .fcard .conj td.eyebrow{padding-top:8px!important}
.fcard .fin.fly-right{transform:translateX(115%) rotate(7deg);opacity:0} .fcard .fin.fly-left{transform:translateX(-115%) rotate(-7deg);opacity:0}
.fcard.lean-right .fin{border-color:var(--go)} .fcard.lean-left .fin{border-color:var(--warn)}
.fcard{overflow:hidden}
.fcard .kind,.ex-label{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);font-weight:600;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 10px;letter-spacing:.01em}
.kind .ki,.ex-label .ki{font-size:15px;line-height:1;color:var(--ink2)}

#tip{position:fixed;z-index:60;background:var(--ink);color:#fff;font-size:13px;padding:6px 10px;border-radius:8px;pointer-events:none;max-width:240px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:90%}
[data-en]{-webkit-touch-callout:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.eyebrow{font-size:13px;color:var(--ink2);font-weight:500}
.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--ink2)}

/* overworld */
.world{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--ink);background:#A9D38C}
.world canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.world svg{position:absolute;inset:0;width:100%;height:100%}
.world .wtown{cursor:pointer}
.px{font-family:'Pixelify Sans','Courier New',monospace;font-size:11px;font-weight:700;letter-spacing:.04em}
.bob{animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.floatcard{position:sticky;bottom:8px;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:10px 12px;box-shadow:0 6px 18px rgba(30,27,22,.16)}
.floatcard .t{flex:1;min-width:0}

/* batch 2 */
.bubble{max-width:86%;border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start;flex-direction:column}
.bubble .nl{font-size:18px;line-height:1.4}
.bubble.tutor{background:var(--soft);align-self:flex-start}
.bubble.tutor .speak{width:34px;height:34px}
.bubble.me{background:#fff;border:1.5px solid var(--line);align-self:flex-end}
.fixnote{border-left:3px solid var(--warn);background:var(--warn-tint);padding:6px 8px;border-radius:0 8px 8px 0;font-size:15px}
.talkbar{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding:8px 0 4px}
.talkbar textarea{flex:1;font-family:var(--display);font-size:18px}
.corr{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.corr input{width:22px;height:22px;accent-color:var(--go);flex:none;margin-top:2px}
.corr .wrong{text-decoration:line-through;color:var(--ink2)}
.corr .right{font-size:17px}
.dots{display:inline-flex;gap:3px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink2);animation:blink 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.conj td.eyebrow{color:var(--ink2)!important;font-family:var(--ui)!important;font-size:13px!important}
/* plan placement */
.loc{font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--ink2);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pill.new{background:var(--verb-fill);color:var(--verb)}
.pill.go{background:var(--go-tint);color:var(--go)}
.placecard{border-left:4px solid var(--go)}
.placecard .corr:last-of-type{border-bottom:0}
.savebar{position:sticky;bottom:0;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 30%);padding:18px 0 10px;margin-top:-8px}
details.card summary{list-style:none} details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:' ›';color:var(--go);font-weight:600}
.planarc{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.planarc h2 .small{font-family:var(--ui);font-weight:500}
.plantown{border:1px solid var(--line);border-radius:14px;padding:12px 12px 4px}
.planrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;min-height:48px;cursor:pointer}
.planrow .t{flex:1;min-width:0}
.planrow .pn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink2)}
.planrow.added .pn{background:var(--verb-fill);color:var(--verb)}
.planrow.focus{background:var(--go-tint);border-radius:10px}
.badge{flex:none;min-width:22px;height:22px;border-radius:11px;background:var(--go);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 6px}
.st{flex:none;font-size:11px;font-weight:600;color:var(--faint);min-width:52px;text-align:right}
.st.klaar,.st.bezig,.st.open{color:var(--go)}
.st.toegevoegd{color:var(--verb)}
.planborder{text-align:center;color:var(--ink2);padding:6px 0 4px;font-style:italic}
.mine{border-left:4px solid var(--verb-line)}
.mine .corr{cursor:default}
.link.sm{font-size:14px;padding:2px 0;min-height:32px}
.procsum{font-size:15px;color:var(--ink)}
.usedrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 0;min-height:44px;cursor:pointer}
.usedrow:first-of-type{border-top:0}
.usedrow .loc{flex:none;width:44px}
.usedrow .t{flex:1;min-width:0}
.usedrow .chev{color:var(--go)}
.deel{display:flex;flex-direction:column;gap:10px;margin-top:10px}
details.planarc{border:0;gap:10px}
details.planarc>summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 12px;border-radius:12px;background:var(--soft);min-height:48px;font-family:var(--display);font-size:18px}
details.planarc>summary::-webkit-details-marker{display:none}
details.planarc>summary .t{flex:1}
details.planarc>summary .small{font-family:var(--ui)}
details.planarc>summary::after{content:'›';color:var(--go);font-weight:600;transition:transform .15s}
details.planarc[open]>summary::after{transform:rotate(90deg)}
details.planarc[open]{display:flex;flex-direction:column}
.plantown .cando{font-style:italic;margin-bottom:4px}
.planrow.review .pn{background:var(--go-tint);color:var(--go)}
/* batch 3 */
.readtext{font-size:19px;line-height:1.65}
.rw{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-color:var(--go);text-decoration-thickness:1.5px;text-underline-offset:4px;cursor:pointer}
.marktline .pn.star,.pn.star{flex:none;width:28px;height:28px;border-radius:50%;background:var(--go-tint);color:var(--go);display:grid;place-items:center;font-size:14px}
/* v1.5: words, cards, curriculum */
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15px;background:var(--soft);border-radius:12px;padding:12px 14px}
.facts dt{color:var(--ink2);font-size:13px;align-self:center}
.facts dd{margin:0;font-family:var(--display);font-size:17px}
details.more>summary{cursor:pointer;color:var(--go);font-weight:600;padding:6px 0;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:' ›'}
.rw.new{text-decoration-color:var(--go)}
.rw.hl{font-weight:700}
.swipe-wrap{position:relative;padding:8px 0}
.swipe-hint{position:absolute;top:20px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:0;transition:opacity .15s}
.swipe-hint.left{left:4px;color:var(--warn)} .swipe-hint.right{right:4px;color:var(--go)}
.swipe-wrap.lean-left .swipe-hint.left,.swipe-wrap.lean-right .swipe-hint.right{opacity:1}
.swipe-wrap.lean-left .fcard2{border-color:var(--warn)} .swipe-wrap.lean-right .fcard2{border-color:var(--go)}
.fcard2{min-height:340px;border:2px solid var(--line);border-radius:20px;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:22px 18px;text-align:center;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;box-shadow:0 6px 18px rgba(30,27,22,.08)}
.fcard2.flipped{background:var(--soft)}
.fcard2 .face{width:100%}
.fcard2 .facts{text-align:left}
.btn.warnline{border-color:var(--warn);color:var(--warn);background:#fff}

details.nsq>summary,details.ntown>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 2px;min-height:48px;cursor:pointer}
details.nsq>summary::-webkit-details-marker,details.ntown>summary::-webkit-details-marker{display:none}
details.nsq>summary .t,details.ntown>summary .t{flex:1;min-width:0}
details.nsq>summary .pn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink2)}
details.ntown>summary::after,details.nsq>summary::after{content:'›';color:var(--go);font-weight:600;transition:transform .15s}
details.ntown[open]>summary::after,details.nsq[open]>summary::after{transform:rotate(90deg)}
details.ntown{padding:0 4px}
details.ntown>.nbody{padding:0 0 10px 6px}
details.nsq>.nbody{padding:4px 4px 14px 34px}
details.nsq.focus>summary{background:var(--go-tint);border-radius:10px}
details.narc{display:flex;flex-direction:column}
[hidden]{display:none!important}

/* 2.0: update toast */
#update{white-space:nowrap;position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;padding:6px 8px 6px 16px;border-radius:12px;font-size:14px;box-shadow:0 6px 18px rgba(30,27,22,.2)}
#update .link{color:#fff;text-decoration:underline;min-height:40px;padding:0 10px}
a.btn{text-decoration:none;text-align:center;box-sizing:border-box}

/* 2.1: Woorden tab groups */
.btn.sm{min-height:40px;padding:8px 12px;font-size:15px}
.wgroup{border-bottom:1px solid var(--line)}
.whead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0}
.wtoggle{flex:1 1 170px;display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 0;background:none;border:0;text-align:left;color:var(--ink);font:inherit;cursor:pointer;-webkit-touch-callout:none}
.wtoggle .t{flex:1;min-width:0;display:flex;flex-direction:column}
.wtoggle .wname{font-size:18px;line-height:1.25}
.wtoggle .chev{color:var(--go);font-size:22px;line-height:1;transition:transform .15s}
.wtoggle .chev.open{transform:rotate(90deg)}
.wacts{display:flex;gap:8px;margin-left:auto}
.wbody{padding:0 0 10px}
.wbody > .row{margin:2px 0 6px}

/* 2.2: synonyms/antonyms, the fix card */
.rel{margin-top:4px;color:var(--ink2)}
.rel b{color:var(--ink);font-weight:500}
.fixlab{display:inline-block;background:var(--warn-tint);color:var(--warn);border-radius:6px;padding:1px 8px;font-weight:600;font-size:14px}
.fixw.hint .fx.d{color:var(--warn);background:var(--warn-tint);border-radius:4px;box-shadow:0 0 0 2px var(--warn-tint);font-weight:600}

/* 2.4: progress on the maps, the town's goal, the opdracht box */
.goal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px}
.goal .gr{display:contents}
.goal .gk{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding-top:3px}
.goal .gv{font-weight:500}
.goal .can .gv{font-size:18px;line-height:1.3}
.progsum{margin-top:-6px}
.legend{display:grid;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.legend .lgs{display:grid;gap:8px}
.legend .lg{display:flex;align-items:center;gap:12px;font-size:15px}
.legend svg{flex:none}
.mission{display:flex;align-items:flex-start;gap:12px}
.mbox{flex:none;width:32px;height:32px;border-radius:8px;border:1.5px solid var(--go);background:var(--bg);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
.mbox.on{background:var(--ink);border-color:var(--ink)}
.sparkle path{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.sparkle path{animation:none}}

/* 2.5: your own sentence, the words that differ */
.yours .d{color:var(--warn);text-decoration:line-through;text-decoration-thickness:1.5px}
.en-hl{font-weight:700;color:var(--ink)}
.dictpill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink2);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:1px 8px;vertical-align:1px}
.dictpill.vl{color:#7A5A12;background:#FBF3DC;border-color:#EAD9A6}

/* 2.8: the opdracht goal in the Praten sheet and on the report screen */
ul.doel{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.doel li{position:relative;padding-left:26px;font-size:16px;line-height:1.35}
ul.doel li::before{content:'';position:absolute;left:2px;top:3px;width:14px;height:14px;border:1.5px solid var(--ink2);border-radius:4px}
.opdr{border-left:4px solid var(--go)}
ul.doel.got li::before{content:attr(data-mark);border:none;top:0;width:auto;height:auto;font-weight:700;font-family:var(--ui)}

const GRAM = {
u1:{title:'Het werkwoord op plaats 2',en:'Verb second · inversion',
 body:[
 'In a Dutch main clause the conjugated verb (<i>de persoonsvorm</i>) always sits in <b>slot 2</b>. Slot 1 can hold the subject, but also a time, a place or a question word.',
 'When something other than the subject takes slot 1, the subject moves to <b>just after the verb</b>. This is called <i>inversie</i>: <i>Ik neem morgen de tram</i> → <i>Morgen neem <b class="subj">ik</b> de tram</i>.',
 'Yes/no questions and commands leave slot 1 empty, so the verb comes first: <i>Neem jij de tram?</i> · <i>Ga rechtdoor.</i>',
 'When <i>jij/je</i> comes after the verb, the verb loses its <i>-t</i>: <i>jij neemt</i> but <i>neem jij?</i>'],
 why:'Dutch keeps the old Germanic “verb-second” rule, as German does. English lost it, except in fossils like “Here comes the tram” or “Never have I seen that”.',
 ex:['u1s2','u1s1','u1s3','u1s7']},
u2:{title:'Scheidbare werkwoorden',en:'Separable verbs',
 body:[
 'Many verbs have a small stressed prefix: <i><b>mee</b>nemen, <b>op</b>bellen, <b>uit</b>stappen, <b>af</b>rekenen</i>.',
 'In a main clause the conjugated part goes to <b>slot 2</b> and the prefix drops to the <b>end</b> (slot 4): <i>Ik <b class="verbword">neem</b> de plant <b class="verbword">mee</b>.</i>',
 'As an infinitive the verb stays in one piece: <i>Ik wil de plant meenemen.</i> In the participle, <i>ge-</i> slips in between: <i>mee<b>ge</b>nomen</i>.',
 'The stress tells you: <i>MEEnemen</i> (separable) versus <i>beSTELlen</i> (not separable, stress on the root).'],
 why:'The prefix is really a small adverb that grew onto the verb, like English “pick the flowers <b>up</b>”. Dutch sends it to the end of the clause, the same place other verb parts go.',
 ex:['u2s1','u2s8','u2s13','u2s10']},
u3:{title:'De of het? · verkleinwoorden',en:'De or het · diminutives',
 body:[
 'Dutch has two words for “the”: <b style="color:var(--de)">de</b> and <b style="color:var(--het)">het</b>. About two thirds of nouns are <i>de</i>.',
 '<b>Four rules that always work:</b> (1) every plural is <i>de</i>; (2) every diminutive in <i>-je</i> is <i>het</i>; (3) a compound takes the article of its last part: <i>het frietkot</i> because <i>het kot</i>; (4) days, months and people doing a job are <i>de</i>.',
 'Diminutive endings: <i>-je</i> (broodje), <i>-tje</i> after a vowel or l/n/r/w (koffietje), <i>-pje</i> after m (boompje), <i>-etje</i> after a short vowel + l, m, n, r, ng (bloemetje, bruggetje).',
 'In Antwerp you will also hear <i>-ke</i> and <i>-ske</i>: <i>een zakske, een manneke</i>.',
 'For everything else: learn each noun <i>with</i> its article. That’s why the app colours it every time.'],
 why:'Old Dutch had three genders. Masculine and feminine merged into <i>de</i>; <i>het</i> is the old neuter. Diminutives were always neuter, which is why even <i>het meisje</i> (the girl) is <i>het</i>, like German <i>das Mädchen</i>.',
 ex:['u3s4','u3s13','u3s1','u3s5']},
};

{id:'u4q2',u:'u4',n:2,name:'Koffieplein',title:'Mag ik…?',en:'May I…?',

{id:'u5q1',u:'u5',n:1,name:'Boekenplein',title:'Hebben + ge…t / ge…d',en:'Have + weak participle',

{id:'u5q2',u:'u5',n:2,name:'Museumplein',title:'Sterke deelwoorden',en:'Strong participles',

{id:'u5q3',u:'u5',n:3,name:'Reizigersplein',title:'Zijn + deelwoord',en:'Be + participle',
 rule:'Verbs of movement to a place or change of state take <i>zijn</i>: <i>ik <b class="verbword">ben</b> naar zee <b class="verbword">gegaan</b>, de trein <b class="verbword">is</b> <b class="verbword">vertrokken</b></i>. Also <i>zijn</i> and <i>blijven</i> themselves: <i>ik ben thuis gebleven</i>.',ex:['u5s14','u5s13','u5s18'],

{id:'u6q1',u:'u6',n:1,name:'Gevelplein',title:'De en het + -e',en:'The + -e',

u4:{title:'Modale werkwoorden',en:'Modal verbs',body:[],why:'Modal verbs work like the separable prefix: the conjugated verb sits in slot 2 and the rest of the verb waits at the end. This “verb bracket” (<i>tangconstructie</i>) is the backbone of Dutch word order. English keeps the verbs together (“I want to buy”); Dutch splits them.',ex:['u4s1']},
u5:{title:'De voltooide tijd',en:'Present perfect',body:[],why:'Dutch uses the perfect for most talk about the past, where English uses the simple past: <i>Ik heb gisteren gewerkt</i> = “I worked yesterday”. The helper verb (<i>hebben/zijn</i>) takes slot 2 and the participle closes the bracket at the end.',ex:['u5s1']},
u6:{title:'Bijvoeglijke naamwoorden op -e',en:'Adjective endings',body:[],why:'Old Dutch had many adjective endings, like German. They wore down to one: <i>-e</i>. The only place it disappears is before a single neuter noun with <i>een</i> or no article, which is exactly where German still uses a special neuter ending.',ex:['u6s1']},

GRAM.u7 = {title:'Bijzinnen', en:'Subordinate clauses', body:[], why:'A subordinate clause is a sentence inside a sentence. Dutch marks it by sending the conjugated verb to the end, so you hear where the clause stops: <i>…dat het museum vandaag open <b class="verbword">is</b>.</i> Only <i>want, maar, en, of</i> (“or”) and <i>dus</i> keep normal order. And when a whole clause stands in slot 1, the main verb still has to be second: <i>Als het regent, neem ik…</i>', ex:['u7s1']};

  const count = {}; SQUARES.forEach(q => { count[q.u] = Math.max(count[q.u] || 0, q.n); });
  const push = (u, name, title, en, rule, review) => { count[u] = (count[u] || 0) + 1; PLAN_SQ.push({id: u + 'q' + count[u], u, n: count[u], name, title, en, rule, review: !!review, built: false, words: [], sents: [], ex: []}); };
  const rows = Object.fromEntries(PLAN_ROWS.map(r => [r[0], r[9]]));
  PLAN_TOWNS.forEach(t => {
    (SQUARES.some(q => q.u === t.id) ? [] : rows[t.id] || []).forEach(([name, title, en, rule]) => push(t.id, name, title, en, rule));
    push(t.id, 'Grote Markt', 'Alles van ' + t.name, 'Town review and field mission', 'Mixes every square of ' + t.name + ' (' + t.gramEn + '), with the field mission: ' + t.canEn, true);
  });
  PLAN_SQ.sort((a, b) => PLAN_TOWNS.indexOf(PT[a.u]) - PLAN_TOWNS.indexOf(PT[b.u]) || a.n - b.n);

const PSQ = Object.fromEntries(PLAN_SQ.map(q => [q.id, q]));
const townIndexInArc = u => PLAN_TOWNS.filter(t => t.arc === PT[u].arc).indexOf(PT[u]) + 1;

const squareCount = u => PLAN_SQ.filter(q => q.u === u).length;

function check(ex, input) {

  }

  if (cand.includes(n)) return {ok: true, kind: 'ok'};
  if (cand.map(deacc).includes(deacc(n))) return {ok: true, kind: 'accent', note: 'Let op de accenten.'};
  if (!ex.whole && ex.lex && ex.lex.p === 'n') {
    const m = n.match(/^(de|het|een)\s+(.*)$/);

      if (m[1] !== 'een' && ex.lex.g && m[1] !== ex.lex.g && !(ex.lex.pl && m[2] === norm(ex.lex.pl))) return {ok: false, kind: 'article'};
      return {ok: true, kind: 'ok'};

  }

function practiceKeys(q) {

  const keys = [];
  newLex.forEach(l => { keys.push('w:' + l.id + ':rec'); if (l.g) keys.push('w:' + l.id + ':gen'); if (l.v) keys.push('w:' + l.id + ':conj'); });
  lex.filter(l => S.items['w:' + l.id + ':rec'] && S.items['w:' + l.id + ':rec'].r >= 1 && !S.items['w:' + l.id + ':prod']).slice(0, 3).forEach(l => keys.push('w:' + l.id + ':prod'));
  sents.filter(s => !S.items['s:' + s.id + ':ord']).slice(0, 4).forEach(s => keys.push('s:' + s.id + ':ord'));
  const pool = squareKeys(q).filter(k => !k.endsWith(':lis'));

  if (keys.length < 10) keys.push(...shuffle(pool.filter(k => S.items[k] && !keys.includes(k))).slice(0, 10 - keys.length));

let FEED = null; const FC = {};
function openFeed() {
  FEED = {n: 0, seen: 0, newWords: 0, t0: Date.now(), usedX: new Set(), fid: 0, since: {n: 0, newW: 0, t: Date.now()}};
  const el = document.createElement('div'); el.id = 'feed'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Scroll');

  document.body.appendChild(el);
  FEED.io = new IntersectionObserver(ents => ents.forEach(en => {
    if (!en.isIntersecting) return; const sec = en.target; const c = FC[sec.dataset.fid]; if (!c || c.viewed) return; c.viewed = true; if (c.kind !== 'b') FEED.seen++; feedViewed(c, sec);
    if (c.kind === 'l' && S.settings.autoAudio) Audio.say(c.s.nl);
    const all = $$('#fscroll .fcard'); if (all.indexOf(sec) >= all.length - 3) feedAppend();
  }), {threshold: 0.6});

}
function closeFeed() {
  if (!FEED) return; FEED.io.disconnect();
  const a = S.activity[dateKey()] = S.activity[dateKey()] || {n: 0, m: 0}; a.m = Math.round(((a.m || 0) + (Date.now() - FEED.t0) / 60000) * 10) / 10;
  Store.mark('state', 'items'); $('#feed').remove(); FEED = null; render();
}
function feedPlan() {
  const intro = Object.keys(S.items).filter(k => /^w:.*:(rec|gen)$/.test(k) && keyValid(k));
  const due = shuffle(intro.filter(isDue)), fam = shuffle(intro.filter(k => !isDue(k)));
  let qs = due.slice(0, 11); if (qs.length < 11) qs = qs.concat(fam.slice(0, 11 - qs.length));
  if (qs.length < 11) {
    for (const l of LEX) { if (qs.length >= 11) break; if (!S.items['w:' + l.id + ':rec'] && S.seen[l.id]) qs.push('w:' + l.id + ':' + (l.g && Math.random() < .5 ? 'gen' : 'rec')); }
  }
  const newL = LEX.filter(l => !S.seen[l.id]).slice(0, qs.length < 6 ? 4 : 2);
  const started = UNITS.filter(u => u.built && unitStarted(u.id)).map(u => u.n); if (!started.length) started.push(1);
  const sents = shuffle(SENT.filter(s => started.includes(s.u)));
  const verbs = shuffle(LEX.filter(l => l.v && (S.seen[l.id] || started.includes(l.u))));
  const nouns = shuffle(LEX.filter(l => l.p === 'n' && (S.seen[l.id] || started.includes(l.u))));
  const glances = [{kind: 'gv', l: verbs[0]}, {kind: 'gf', s: sents[0]}, {kind: 'gn', l: nouns[0]}].filter(g => g.l || g.s);
  const xs = shuffle(EXTRAS.filter(x => !FEED.usedX.has(x.title))).slice(0, 2); xs.forEach(x => FEED.usedX.add(x.title));
  if (FEED.usedX.size >= EXTRAS.length) FEED.usedX.clear();
  // 2.2: conjugation in a sentence, synonym/antonym and definition cards for words the user has met
  const met = shuffle(metWords());
  const cj = shuffle(Object.keys(S.items).filter(k => /^w:.*:conj$/.test(k) && keyValid(k) && conjSentences(LX(k.split(':')[1])).length)).slice(0, 2);
  const rs = met.filter(l => { const r = relOf(l); return r.syn.length || r.ant.length; }).slice(0, 2);
  const ds = met.filter(l => l.d && !rs.includes(l)).slice(0, 2);
  const pattern = ['q', 'q', 'w', 'r', 'q', 'x', 'c', 'q', 'g', 'd', 'q', 'l', 'n', 'q', 'r', 'q', 'x', 'c', 'q', 'g', 'w', 'd', 'q', 'l', 'n', 'q'];
  const out = []; let qi = 0, xi = 0, gi = 0, li = 0, ni = 0, ci = 0, ri = 0, di = 0;
  const gl = shuffle(glances);
  pattern.forEach(p => {
    if (p === 'q' && qs[qi]) out.push({kind: 'q', key: qs[qi++]});
    else if (p === 'w' && qs[qi]) { const id = qs[qi++].split(':')[1]; out.push({kind: 'w', l: LX(id)}); }
    else if (p === 'x' && xs[xi]) out.push({kind: 'x', x: xs[xi++]});
    else if (p === 'c' && cj[ci]) out.push({kind: 'q', key: cj[ci++]});
    else if (p === 'r' && rs[ri]) out.push({kind: 'r', l: rs[ri++]});
    else if (p === 'd' && ds[di]) out.push({kind: 'd', l: ds[di++]});
    else if (p === 'g' && gl[gi]) out.push(gl[gi++]);
    else if (p === 'l' && sents[1 + li]) out.push({kind: 'l', s: sents[1 + li++]});
    else if (p === 'n' && newL[ni]) out.push({kind: 'n', l: newL[ni++]});
    else if (newL[ni]) out.push({kind: 'n', l: newL[ni++]});
  });
  while (newL[ni]) out.push({kind: 'n', l: newL[ni++]});
  out.push({kind: 'b'});
  return out;
}

// a sideways swipe on a 'Ken je dit woord?' card: right = Wist ik, left = Nog niet; up and down still scroll
function feedSwipe(sec, fid) {

  fin.addEventListener('pointermove', e => {

    if (!side && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.5) side = true;
    if (!side) { if (Math.abs(dy) > 12) x0 = null; return; }
    fin.style.transition = 'none'; fin.style.transform = `translateX(${dx}px) rotate(${dx / 24}deg)`;
    sec.classList.toggle('lean-right', dx > 60); sec.classList.toggle('lean-left', dx < -60);

/* ===== PLAN PLACEMENT: every mistake and word gets a place in the plan =====

/* ---------- where things live ---------- */
const FORM_IX = (() => {
  const ix = {};
  const add = (f, id) => { const k = norm(f); if (k && k.length > 1 && !ix[k]) ix[k] = id; };
  LEX.forEach(l => { [l.w, l.pl, l.dim, l.e].forEach(f => f && add(f, l.id)); if (l.v) allForms(l).forEach(f => add(f, l.id)); });
  LEX.forEach(l => textForms(l).forEach(f => add(f, l.id))); // after every listed form, so a listed form always wins
  return ix;
})();
const SQ_OF_WORD = (() => { const m = {}; PLAN_SQ.forEach(q => (q.words || []).forEach(w => { m[w] = q.id; })); return m; })();
function planLoc(id) {

  const x = (S.extras || []).find(e => e.id === id);
  if (x) { if (!x.town || !PT[x.town]) return {id, kind: 'added', arc: null, town: null, townName: 'Nog niet geplaatst', sq: null, sqName: 'Toegevoegd', title: x.title, en: '', u: null};
    return {id, kind: 'added', arc: arcOf(x.town).n, town: townIndexInArc(x.town), townName: PT[x.town].name, sq: null, sqName: 'toegevoegd plein', title: x.title, en: '', u: x.town}; }
  return null;
}
function locLine(L) { if (!L) return 'Algemeen'; return L.arc ? `Boog ${L.arc} · Stad ${L.town} · ${L.sq ? 'Plein ' + L.sq : 'toegevoegd'}` : 'Nog niet geplaatst'; }
function locStatus(L) {
  if (!L) return '';
  if (L.kind === 'added') return 'toegevoegd';
  if (PSQ[L.id] && PSQ[L.id].review) return PSQ[L.id].built ? marktStatus(L) : 'later';
  if (L.kind === 'planned') return 'later';

}
const planOrder = id => { const i = PLAN_SQ.findIndex(q => q.id === id); if (i >= 0) return i; const x = (S.extras || []).find(e => e.id === id); if (x && x.town) { const j = PLAN_SQ.findIndex(q => q.u === x.town); return j + 2.5; } return 9999; };

}

  const words = Object.values(S.custom || {}).filter(w => (w.plan || null) === id);

function openProc(o) {

  const newTopics = []; const topicKey = t => 'new:' + (t.town || '') + ':' + norm(t.title || '');

    let key = PSQ[c.plan] ? c.plan : null;

const CMP = {goed: ['beter', 'best'], veel: ['meer', 'meest'], weinig: ['minder', 'minst'], graag: ['liever', 'liefst'], vaak: ['vaker', 'vaakst'], dichtbij: ['dichterbij', 'dichtstbij'], moe: ['moeër', 'moest'], vorig: null};
function adjForms(l) {
  const w = l.w.toLowerCase();
  if (w in CMP) return CMP[w];
  if (l.p !== 'adj') return null;
  const e = l.e || adjE(w);
  const cmp = w.endsWith('r') ? w + 'der' : e + 'r';
  const sup = w.endsWith('s') ? w + 't' : w + 'st';

// the -e form of an adjective by the spelling rules (content words give it as l.e):
// a long vowel in a closed syllable loses one letter (breed → brede, zwaar → zware),
// f/s after a long vowel become v/z (lief → lieve, boos → boze),
// a short stressed vowel doubles the consonant (wit → witte); -ig, -lijk, -isch stay (vriendelijke)
function adjE(w) {
  w = String(w).toLowerCase();
  if (/(ig|lijk|isch|en|er|el)$/.test(w) && w.length > 4) return w + 'e';
  let m = w.match(/^(.*?)(aa|ee|oo|uu)([^aeiou])$/);
  if (m) { const c = {f: 'v', s: 'z'}[m[3]] || m[3]; return m[1] + m[2][0] + c + 'e'; }

  if (m) return m[1] + m[2] + (m[3] === 'f' ? 'v' : 'z') + 'e';
  m = w.match(/^([^aeiou]*)([aeiou])([bdfgklmnprst])$/);

}

function registerSW() {

/* ---------- conjugation in a sentence ----------
   The gap is a conjugated verb in one of the app's own sentences. The choices stay in
   one tense (neem/neemt/nemen or nam/namen/genomen), so only one answer fits. */
function conjSentences(l) {

  const now = uniq([f.ik, f.jij, f.hij, f.pl, f.inv, f.u].filter(Boolean).map(x => x.toLowerCase()));
  const past = uniq([f.im[0], f.im[1]].filter(Boolean).map(x => x.toLowerCase()));
  return (lexSent[l.id] || []).map(o => { const s = o.surf.toLowerCase(); return now.includes(s) ? {...o, tense: 'nu'} : past.includes(s) ? {...o, tense: 'verleden'} : null; }).filter(Boolean);
}
function conjOptions(l, o) {

  const pool = o.tense === 'nu' ? [f.ik, f.hij, f.pl] : [f.im[0], f.im[1], f.pp];

/* ---------- Verbeter de zin: what kind of mistake, where, and a hint ---------- */
const FIX_LABEL = {'word order': ['Woordvolgorde', 'Word order'], article: ['Lidwoord (de/het)', 'Article'], 'verb form': ['Werkwoordsvorm', 'Verb form'], adjective: ['Bijvoeglijk naamwoord', 'Adjective ending'], spelling: ['Spelling', 'Spelling'], 'word choice': ['Woordkeuze', 'Word choice'], other: ['Iets anders', 'Something else']};
const toks = s => norm(s).split(' ').filter(Boolean);
function multisetMinus(a, b) { const m = {}; b.forEach(x => { m[x] = (m[x] || 0) + 1; }); return a.filter(x => { if (m[x]) { m[x]--; return false; } return true; }); }
// the type from the report, or worked out from the two sentences (older corrections have none)
function fixType(f) {
  const t = String(f.type || '').toLowerCase();
  if (FIX_LABEL[t] && t !== 'other') return t;
  const w = toks(f.wrong), r = toks(f.right);
  const a = multisetMinus(w, r), b = multisetMinus(r, w);
  if (!a.length && !b.length) return 'word order';
  if (a.concat(b).every(x => ['de', 'het', 'een'].includes(x))) return 'article';
  if (a.length === 1 && b.length === 1) {
    const [x, y] = [a[0], b[0]];
    if (x + 'e' === y || y + 'e' === x) return 'adjective';
    const ix = FORM_IX[x], iy = FORM_IX[y];
    if ((ix && ix === iy && LX(ix).v) || (LEX.some(l => l.v && allForms(l).includes(x)) && LEX.some(l => l.v && allForms(l).includes(y)))) return 'verb form';
    if (lev(x, y) <= 2) return 'spelling';
  }

}

function fixDiff(wrong, right) {
  const w = toks(wrong), r = toks(right); const n = w.length, m = r.length;
  const L = Array.from({length: n + 1}, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = w[i] === r[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const keep = new Set(); let i = 0, j = 0;
  while (i < n && j < m) { if (w[i] === r[j]) { keep.add(i); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++; }
  return new Set(w.map((_, k) => k).filter(k => !keep.has(k)));
}

  const words = String(f.wrong).trim().split(/\s+/); const diff = fixDiff(f.wrong, f.right);
  const x = (S.extras || []).find(e => e.id === f.plan);
  const place = PSQ[f.plan] ? `${PSQ[f.plan].name} · ${PSQ[f.plan].title.toLowerCase()}` : x ? x.title : '';
  const from = [SRC_NAME[f.src] ? 'uit ' + SRC_NAME[f.src] : '', shortDate(f.date)].filter(Boolean).join(', ');
  return {type: 'type', key, label: 'fix', fixType: t,
    prompt: `<span class="nl fixw" style="font-size:20px">${words.map((w, i) => `<span class="fx${diff.has(i) ? ' d' : ''}">${esc(w)}</span>`).join(' ')}</span>`,
    sub: `<span class="fixlab" data-en="${labEn}">${lab}</span>${place ? ` · <span class="small">${esc(place)}</span>` : ''}<br><span class="small">Verbeter de zin${from ? ' · ' + esc(from) : ''}.</span>${diff.size ? ` <button class="link sm" type="button" data-act="fix-hint" style="padding-left:0">Hint: wat is er mis? ›</button>` : ''} <button class="link sm" type="button" data-act="fix-del" data-id="${esc(key.split(':')[1])}" style="padding-left:0;color:var(--warn)" data-en="Not a real mistake? Delete it">Geen echte fout? Verwijder ›</button>`,
    answer: f.right, accept: [norm(f.right)], whole: true, why: esc(f.why || ''), say: f.right};
}

/* ===== VERSION 2.4: progress you can see =====
   One visual language on every level:
   - a building is a piece of work: grey until it is done, in its colour once done
   - a yellow flag on it = gehaald (80% or more); a flag with a white star = 100%
   - Ronde 2: colourful flags go up across the plein (on the stad map and over its guild houses);
     Ronde 3: the same flags turn gold, with sparkles
   - bunting over a Grote Markt (and around a town on the Pad) = the Grote Markt is done
   - gold kerbs and sparkles = everything perfect
   Stad map: each plein has its own five guild houses, in the same colours as on the plein.
   Pad: each town has three plein houses and a town hall for its Grote Markt. */

/* ---------- the numbers ---------- */
// 0 = not yet, 1 = gehaald, 2 = 100% (Ontdek is done or not; Gebruik has a score since 2.8; a test-out counts as gehaald)
function houseLevel(q, st) {
  const v = S.sq[q] && S.sq[q].steps && S.sq[q].steps[st]; if (!v) return 0;
  // 2.8: Gebruik has a score like Oefen; a 1 from before scores counts as 100%
  if (v === 'test') return 1; if (st === 'ontdek' || (st === 'gebruik' && v === 1)) return 2;
  return v >= 100 ? 2 : 1;
}
function pleinProgress(q) {
  const levels = STEPS.map(st => houseLevel(q, st));
  const complete = sqComplete(q); const r = (S.sq[q] && S.sq[q].rounds && S.sq[q].rounds.oefen) || 1;
  const ronde = stepDone(q, 'oefen') ? r : 0;
  return {levels, done: levels.filter(Boolean).length, top: levels.filter(l => l === 2).length, complete, ronde, perfect: levels.every(l => l === 2) && ronde >= 3};
}
const missionDone = u => !!(S.missions || {})[u];
function townProgress(u) {
  const ps = squaresOf(u).map(q => pleinProgress(q.id)); const m = (S.markt || {})[u] || 0;
  return {pleinen: ps, complete: ps.filter(p => p.complete).length, perfectPleinen: ps.filter(p => p.perfect).length, markt: m, marktDone: m >= 80, marktTop: m >= 100, mission: missionDone(u),
    perfect: ps.length > 0 && ps.every(p => p.perfect) && m >= 100 && missionDone(u)};
}

/* ---------- small pixel pieces for the map overlays (SVG) ---------- */
const GOLD = '#E0A82E';
function miniFlag(x, y, top) {
  return `<g transform="translate(${x},${y})" shape-rendering="crispEdges"><rect width="1.4" height="11" fill="#2A2620"/><rect x="1.4" width="8" height="5" fill="${top ? GOLD : '#F2D35B'}" stroke="#2A2620" stroke-width=".8"/>${top ? '<path d="M5.4,0.7 L6.1,2 L7.5,2.1 L6.4,3 L6.8,4.3 L5.4,3.6 L4,4.3 L4.4,3 L3.3,2.1 L4.7,2 Z" fill="#fff"/>' : ''}</g>`;
}
// feestvlaggetjes: a sagging string of small triangles between two points
function bunting(x1, y1, x2, y2, gold, z = 1) {
  const sag = 7 * z, n = Math.max(3, Math.round(Math.hypot(x2 - x1, y2 - y1) / (7 * z))); const cols = gold ? [GOLD, '#F2D35B'] : FACADE;
  let s = `<path d="M${x1},${y1} Q${(x1 + x2) / 2},${(y1 + y2) / 2 + sag} ${x2},${y2}" fill="none" stroke="#2A2620" stroke-width="${.8 * z}"/>`;
  for (let k = 1; k < n; k++) { const t = k / n; const x = (1 - t) ** 2 * x1 + 2 * (1 - t) * t * (x1 + x2) / 2 + t * t * x2, y = (1 - t) ** 2 * y1 + 2 * (1 - t) * t * ((y1 + y2) / 2 + sag) + t * t * y2;
    s += `<path class="bt" d="M${x - 2 * z},${y} L${x + 2 * z},${y} L${x},${y + 4 * z} Z" fill="${cols[k % cols.length]}" stroke="#2A2620" stroke-width="${.5 * z}"/>`; }
  return `<g class="bunting${gold ? ' gold' : ''}" aria-hidden="true">${s}</g>`;
}
// Ronde 2: flags across; Ronde 3: gold flags with sparkles along them
function roundsFlags(x1, y1, x2, y2, ronde, z = 1) {
  if (ronde < 2) return ''; const gold = ronde >= 3;
  return bunting(x1, y1, x2, y2, gold, z) + (gold ? sparkles(0, 0, 1, [.15, .5, .85].map((t, k) => [x1 + (x2 - x1) * t, (y1 + y2) / 2 + 7 * z * (1 - (2 * t - 1) ** 2) - 6 * z, k * .5])) : '');
}
// sparkles around a perfect square (they twinkle unless reduced motion); pts overrides where they go
function sparkles(cx, cy, r, pts) {
  return `<g class="sparkle" aria-hidden="true">${(pts || [[-1, -1, 0], [1, -.8, .4], [1.1, .9, .8], [-.9, 1, 1.2], [0, -1.25, .6]]).map(([dx, dy, dl]) => `<g transform="translate(${cx + dx * r},${cy + dy * r})"><path style="animation-delay:${dl}s" d="M0,-7 L1.6,-1.6 L7,0 L1.6,1.6 L0,7 L-1.6,1.6 L-7,0 L-1.6,-1.6 Z" fill="#fff" stroke="${GOLD}" stroke-width="1"/></g>`).join('')}</g>`;
}

/* ===== VERSION 2.5: clearer cards (from the user's review) =====
   - every card says what kind of card it is in one clear label (kindLabel)
   - a fill-in card marks the English word that belongs in the gap (enCue), so only one choice fits
   - the Scroll listening card asks what the sentence means before it shows it
   The rules behind these are in CLAUDE.md (Writing content) and tests/validate.js checks them. */

/* ---------- the card label ---------- */
const KIND_ICON = {syn: '≈', ant: '⇄', def: '?', lisMc: '♪', lisType: '♪', lis: '♪'};
Object.assign(DAYWORD, {lis: 'Luister'}); Object.assign(DAYWORD_EN, {lis: 'Listen'});
function kindLabel(label, cls = 'kind') {
  const t = DAYWORD[label] || (cls === 'kind' ? 'Kies' : ''); if (!t) return '';
  return `<div class="${cls}" data-en="${esc(DAYWORD_EN[label] || '')}">${KIND_ICON[label] ? `<span class="ki" aria-hidden="true">${KIND_ICON[label]}</span>` : ''}${t}</div>`;
}

/* ---------- the English word that belongs in the gap ---------- */
const EN_IRR = {be: 'is are am was were been ’m ’re ’s', will: '’ll would', shall: '’ll', have: 'has had', do: 'does did done', go: 'goes went gone', come: 'came', get: 'got gotten', take: 'took taken', buy: 'bought', eat: 'ate eaten', drink: 'drank drunk', see: 'saw seen', read: 'read', write: 'wrote written', find: 'found', give: 'gave given', make: 'made', say: 'said', think: 'thought', know: 'knew known', leave: 'left', bring: 'brought', sit: 'sat', stand: 'stood', run: 'ran', ride: 'rode ridden', speak: 'spoke spoken', sleep: 'slept', pay: 'paid', sell: 'sold', tell: 'told', meet: 'met', choose: 'chose chosen', begin: 'began begun', keep: 'kept', feel: 'felt', hear: 'heard', lie: 'lay lain lying', hang: 'hung', put: 'put', let: 'let', cost: 'cost', send: 'sent', spend: 'spent', win: 'won', lose: 'lost', fall: 'fell fallen', forget: 'forgot forgotten', understand: 'understood', become: 'became', swim: 'swam swum', sing: 'sang sung', fly: 'flew flown', wear: 'wore worn', hold: 'held', catch: 'caught', teach: 'taught', drive: 'drove driven', break: 'broke broken', grow: 'grew grown', throw: 'threw thrown', show: 'shown', shine: 'shone', light: 'lit', can: 'could', must: 'had to', may: 'might', child: 'children', person: 'people', man: 'men', woman: 'women'};
const reEsc = x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
// the forms an English gloss can take in a sentence: tram → trams, take → takes/took/taking, happy → happier
function enForms(w) {
  const f = new Set([w, w + 's', w + 'es', w + 'ed', w + 'd', w + 'ing', w + 'er', w + 'est', w + 'ly']);
  if (/[^aeiou]y$/.test(w)) ['ies', 'ied', 'ier', 'iest', 'ily'].forEach(e => f.add(w.slice(0, -1) + e));
  if (/e$/.test(w)) ['ing', 'ed', 'er', 'est'].forEach(e => f.add(w.slice(0, -1) + e));
  if (/[^aeiou][aeiou][bdglmnprt]$/.test(w)) ['ing', 'ed', 'er'].forEach(e => f.add(w + w.slice(-1) + e));
  (EN_IRR[w] || '').split(' ').filter(Boolean).forEach(x => f.add(x));
  return [...f];
}
// other English words for a lemma, when the sentences use them instead of the gloss (fiets: "bike", not "bicycle")
const EN_ALSO = {fiets: 'bike', nemen: 'have', opbellen: 'call', broodje: 'roll', pint: 'beer', stoofvlees: 'stew', drinken: 'have', liggen: 'be', willen: 'would like', zee: 'seaside'};
// the gloss as phrases to look for: "to pick out" → ["pick out", "pick"]; "to get, receive" → ["get", "receive"]
function enGlosses(l) {
  const raw = String(l.en || '').replace(/\([^)]*\)/g, ' ').split(/[,;/]| or /).concat(EN_ALSO[l.id] ? EN_ALSO[l.id].split(',') : []);
  const out = [];
  raw.map(x => x.trim().toLowerCase().replace(/^(to|a|an|the)\s+/, '').replace(/\s+/g, ' ')).filter(Boolean).forEach(x => {
    out.push(x); const w = x.split(' '); if (w.length > 1 && !['a', 'the'].includes(w[0])) out.push(w[0]);
  });
  return uniq(out);
}
// where the gloss is in the English sentence: [start, end] or null
function enSpot(en, l) {
  for (const g of enGlosses(l)) {
    const w = g.split(' '); const heads = enForms(w[0]);
    for (const h of heads.sort((a, b) => b.length - a.length)) {
      // a contraction (’m, ’ll) sits right after its subject: no word boundary in front
      const re = new RegExp((/^[’']/.test(h) ? '()' : '(^|[^\\p{L}’\'])') + '(' + reEsc([h].concat(w.slice(1)).join(' ')) + ')(?=[^\\p{L}]|$)', 'iu');
      const m = re.exec(en); if (m) return [m.index + m[1].length, m.index + m[1].length + m[2].length];
    }
  }
  return null;
}
// the English sentence with the gap's word marked; if it can't be found, the gloss follows in brackets
function enCue(en, l) {
  const at = enSpot(en, l);
  if (at) return `${esc(en.slice(0, at[0]))}<b class="en-hl">${esc(en.slice(at[0], at[1]))}</b>${esc(en.slice(at[1]))}`;
  return `${esc(en)} <span class="en-hl">(= ${esc(enGlosses(l)[0] || l.en || '')})</span>`;
}

/* ---------- Scroll: the listening card asks what the sentence means ---------- */
function lisOptions(s) {
  const pool = shuffle(SENT.filter(x => x.id !== s.id && x.u === s.u)).concat(shuffle(SENT.filter(x => x.u !== s.u)));
  const out = [s.en]; for (const x of pool) { if (!out.some(o => norm(o) === norm(x.en))) out.push(x.en); if (out.length === 3) break; }
  return shuffle(out);
}
// replaces the 'l' card of fcardHTML (app5)

function feedListen(fid, j) {

/* ===== VERSION 2.6: the woordenboek =====
   A built-in dictionary (woordenboek.json, made by build.py from src/woordenboek/*.jsonl).
   - tap a word the app has no card for: the filled-in card opens, one tap adds it (to a set if you like)
   - the Nieuw woord form fills itself in when the word is in the woordenboek
   - searching in Woorden also finds woordenboek words
   - The user's own words (imported lists) get their missing forms from it
   The file loads a few seconds after start (never while the app opens) and the service worker keeps it offline. */

let DICT = null, DICT_IX = null, DICT_P = null;
// names at the start of a sentence in the app's texts: they need no card (tests/validate.js)
const WB_NAMES = ['sarah', 'lies', 'tom', 'karim', 'maria', 'emma', 'pieter', 'nadia', 'rubens', 'antwerpen', 'gent', 'brussel', 'zurenborg', 'berchem', 'meir', 'schelde', 'seef'];
function loadDict() {
  if (DICT) return Promise.resolve(DICT);
  if (!DICT_P) DICT_P = fetch('woordenboek.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(list => {
    DICT = list.map(x => ({...x, id: 'd:' + x.w + ':' + x.p, dict: true})); DICT_IX = {};
    const add = (f, l) => { const k = norm(f || ''); if (k && !DICT_IX[k]) DICT_IX[k] = l; };
    DICT.forEach(l => add(l.w, l)); // lemmas first, so "kast" never points at another word's form
    DICT.forEach(l => { [l.pl, l.dim, l.e].concat(l.f || []).forEach(f => add(f, l)); if (l.v) allForms(l).forEach(f => add(f, l)); });
    DICT.forEach(l => textForms(l).forEach(f => add(f, l)));
    enrichCustom();
    return DICT;
  }).catch(e => { DICT_P = null; throw e; });
  return DICT_P;
}
// a word as it stands in a text → its woordenboek entry (or null)
const dictFind = w => (DICT_IX && DICT_IX[norm(w)]) || null;
// one of the user's own words with the same lemma and part of speech
const ownFor = l => Object.values(S.custom || {}).find(c => norm(c.w) === norm(l.w) && (c.p === l.p || !c.p));

/* ---------- tapping a word ---------- */
function lookupWord(w) {
  const go = () => {
    const l = dictFind(w);
    if (!l) return quickAdd(w, true);
    const own = ownFor(l); if (own) return showWord(own.id);
    openDictCard(l);
  };
  if (DICT) return go();
  toast('Even het woordenboek openen…');
  loadDict().then(go, () => quickAdd(w, true));
}
function openDictCard(l) {
  const s = openSheet(`<div class="stack">
    ${wordCardHTML(l, {actions: false}).replace('<div class="eyebrow">', `<div class="eyebrow"><span class="dictpill" data-en="From the dictionary">Woordenboek</span> ${l.vl ? '<span class="dictpill vl" data-en="Flemish">Vlaams</span> ' : ''}`)}
    <label class="f">Zet ook in set<select id="dc-set"><option value="">Geen set (alleen bij mijn woorden)</option>${S.sets.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label>
    <button class="btn block" id="dc-add">+ Voeg toe aan mijn woorden</button>
  </div>`);
  s.querySelector('#dc-add').onclick = () => { const id = addDictWord(l, s.querySelector('#dc-set').value); closeSheet(); toast('Bewaard: ' + l.w); render(); return id; };
}
// copy the entry into the user's own words (with every form), straight into Herhalen
function addDictWord(l, setId) {
  const own = ownFor(l); let id = own && own.id;
  if (!id) {
    id = uid('u-'); const {dict, ...rest} = l;
    S.custom[id] = {...rest, id, custom: true, u: 0, plan: null, src: 'woordenboek', date: dateKey()};
    S.seen[id] = 1; introduce('w:' + id + ':rec'); if (l.g) introduce('w:' + id + ':gen');
  }
  if (setId) { const set = S.sets.find(x => x.id === setId); if (set && !set.ids.includes(id)) set.ids.push(id); }
  Store.mark('words', 'items', 'state'); return id;
}
// redefines quickAdd (app13): for a word that is not in the woordenboek either: say so, and offer Claude
function quickAdd(w, missing) {
  const sets = S.sets;

const WLM_S = 1, TLM_S = 1.5;

/* ---------- the town map also has the same sign, small, here and there on the grass around the pleinen ---------- */
const LM_FREE = ['grass', 'flower', 'tuft', 'field', 'field2'];
const SCATTER_MAX = 9;
// free blocks of grass (a ring of one cell keeps them off roads and houses), spread out over the map; marked as 'house' so names and trees keep off
function scatterSpots(g, wc, hc, ok, n) {
  const hard = t => ['road', 'house', 'plaza', 'path', 'bridge'].includes(t); const out = [];
  const free = (x, y) => { for (let dy = -1; dy <= hc; dy++) for (let dx = -1; dx <= wc; dx++) { const t = g[y + dy] && g[y + dy][x + dx]; const inside = dy >= 0 && dy < hc && dx >= 0 && dx < wc;
    if (t === undefined || (inside ? !LM_FREE.includes(t) && t !== 'tree' && t !== 'treeX' : hard(t))) return false; } return true; };
  while (out.length < n) {

    for (let y = 1; y + hc < g.length - 1; y++) for (let x = 1; x + wc < g[0].length - 1; x++) {

      const d = out.length ? Math.min(...out.map(o => Math.hypot(o.x - x, o.y - y))) : 99; if (d < 6) continue;

      if (!best || sc < best.sc) best = {x, y, sc};

    if (!best) break;

  T.squares.forEach((q, j) => { q.sign = j < 3; });
  const [wc, hc] = lmCells(key, 1);
  // off the squares, and first where the names would stand (with the cyclist on any plein), so a sign never takes a name's spot
  const clear = (x, y) => TSQ.every(q => x + wc <= q.t[0] - q.h - 2 || x >= q.t[0] + q.h + 2 || y + hc <= q.t[1] - q.h - 3 || y >= q.t[1] + q.h + 2);

    const taken = squaresOf(u).flatMap((q, j) => { const [x, y] = sqCenter(TSQ[j]); return [[x - 28, y - 18, 56, 14]].concat(j === here ? [heroRect(x, y)] : []); })
      .concat([[mx - mh, my - mh + 2, 2 * mh, 14], [mx - mh, my + 2, 2 * mh, 14], [mx - 10, my - 12, 20, 20]], lmRects('town', u));

    case 'read-ans': readAnswer(+d.i, +d.j); break;
    case 'read-close': closeOverlay('read'); READING = null; render(); break;
    case 'read-again': openRead(d.q); break;
    case 'markt': TAB = 'pad'; PAD.lvl = 'markt'; PAD.u = d.u; render(); $('#main').scrollTop = 0; break;
    case 'markt-review': if (!marktOpen(d.u)) { toast('Doe eerst alle pleinen van deze stad.'); break; } { const ks = marktKeys(d.u); ks.forEach(k => introduce(k)); startSession({keys: ks, markt: d.u, intros: false}); } break;
    case 'round': startRound(d.q, +d.r); break;
    case 'plan-go': openPlan(d.id); break;
    case 'plan-sq': openPlanSquare(d.id); break;
    case 'mine-practise': practiseMine(d.id); break;
    case 'extra-del': confirmBox('Dit toegevoegde plein verwijderen? Je fouten blijven bewaard onder Algemeen.', 'Verwijder', () => { closeSheet(); closeOverlay('plan'); Object.values(S.fix).forEach(f => { if (f.plan === d.id) f.plan = null; }); S.extras = S.extras.filter(x => x.id !== d.id); Object.keys(S.items).filter(k => k.startsWith('e:' + d.id)).forEach(k => delete S.items[k]); Store.mark('words', 'items', 'state'); closeOverlay('extra'); render(); }); break;
    case 'sic-sq': TAB = 'pad'; PAD.lvl = 'sq'; PAD.q = d.id; PAD.u = d.u; render(); $('#main').scrollTop = 0; break;
    case 'sic-town': if (UNIT[d.u].built) { TAB = 'pad'; PAD.lvl = 'town'; PAD.u = d.u; render(); $('#main').scrollTop = 0; } else toast(UNIT[d.u].name + ' volgt later'); break;
    case 'then': thenAndNow(); break;
    case 'coach-ok': S.coach[d.id] = 1; Store.mark('state'); { const t = el.closest('.tip'); if (t) t.remove(); } break;
    case 'tour-next': openTour(TOURI + 1); break;
    case 'tour-prev': openTour(TOURI - 1); break;
    case 'tour-end': S.coach.tour = 1; Store.mark('state'); closeOverlay('tour'); render(); break;
    case 'tour-again': closeOverlay('help'); openTour(0); break;
    case 'tips-again': S.coach = {tour: 1}; Store.mark('state'); closeOverlay('help'); render(); toast('Alle tips staan weer aan'); break;
    case 'review': startReview(); break;
    case 'step': closeSheet(); if (TAB === 'pad' && PAD.lvl === 'sq') goStep(d.q, d.step); else startStep(d.q, d.step); break;
    case 'feed': openFeed(); break;
    case 'mission': missionToggle(d.u); break; // app17: one opdracht per town, the same box on the stad page and the Grote Markt
    case 'town': goTown(d.u); break;
    case 'naslag': NASLAG = d.seg; render(); break;
    case 'cards': closeOverlay('setpage'); openCards(d.set); break;
    case 'set-review': closeOverlay('setpage'); reviewSet(d.id); break;
    case 'wview': S.settings.wview = d.v; Store.mark('state'); render(); break;
    case 'wgroup': if (WOPEN.has(d.id)) WOPEN.delete(d.id); else WOPEN.add(d.id); render(); break;
    case 'wng': WNG = d.g; render(); break;
    case 'set-rename': renameSet(d.id); break;
    case 'set-export': exportSet(d.id); break;
    case 'theme-pick': themePicker(d.id); break;
    case 'theme-set': setTheme(d.id, d.t); break;
    case 'word-import': openWordImport(); break;
    case 'fix-del': deleteFix(d.id); break;
    case 'fix-hint': { const w = $('#ses-body .fixw'); if (w) w.classList.add('hint'); el.remove(); break; }
    case 'card-grade': cardGrade(d.ok === '1'); break;
    case 'cards-again': startCards(shuffle(CARDS.unknown), {mode: CARDS.mode, dir: CARDS.dir, name: CARDS.name}); break;
    case 'word-add': closeSheet(); quickAdd(d.w); break;
    case 'word-look': closeSheet(); lookupWord(d.w); break;
    case 'dict-word': { const l = dictById(d.id); if (l) { closeSheet(); openDictCard(l); } break; }
    case 'word': showWord(d.id); break;
    case 'lesson-ro': openLesson(d.q, true); break;
    case 'lesson-done': closeOverlay('lesson'); startStep(d.q, 'oefen'); break;
    case 'overlay-close': Audio.stop(); closeOverlay(d.id); if (d.id === 'flash') FLASH = null; render(); break;
    case 'ses-close': closeSession(); break;
    case 'ses-next': sesNext(); break;
    case 'ans': submitAnswer(d.v); break;
    case 'check': submitAnswer(''); break;
    case 'tok': {
      if (!SES || SES.answered) break;
      if (el.closest('#tok-pool')) { el.classList.add('used'); const b = document.createElement('button'); b.className = 'tok'; b.dataset.act = 'tok'; b.dataset.j = d.j; b.textContent = el.textContent; $('#tok-ans').appendChild(b); }
      else { const p = $(`#tok-pool .tok[data-j="${d.j}"]`); if (p) p.classList.remove('used'); el.remove(); }
      break;
    }
    case 'say': Audio.say(d.text, el); break;
    case 'reveal-en': el.textContent = d.enText || '—'; el.style.borderStyle = 'solid'; el.style.color = 'var(--ink)'; break;
    case 'add-to-set': addToSetSheet(d.id); break;
    case 'set-add': { const set = S.sets.find(s => s.id === d.set); if (set && !set.ids.includes(d.id)) { set.ids.push(d.id); Store.mark('words'); toast('Toegevoegd aan ' + set.name); } if (d.close) closeSheet(); else setEditor(d.set); render(); break; }
    case 'set-remove': { const set = S.sets.find(s => s.id === d.set); if (set) { set.ids = set.ids.filter(x => x !== d.id); Store.mark('words'); openSetPage(d.set); render(); } break; }
    case 'set-delete': deleteSet(d.id); break;
    case 'set-new': newSet(); break;
    case 'set-new-with': newSet(d.id); break;
    case 'set-edit': setEditor(d.id); break;
    case 'set-study': studySet(d.id, d.mode); break;
    case 'unit-set': openSheet(`<div class="stack"><h2>Woorden van ${esc(UNIT[d.u].name)}</h2><div class="small">${lexOfUnit(UNIT[d.u].n).length} woorden, elk met een zin, het lidwoord en een Nederlandse uitleg.</div><div class="grid2"><button class="btn line" data-act="set-study" data-id="unit-${d.u}" data-mode="flip">Kaarten</button><button class="btn line" data-act="set-study" data-id="unit-${d.u}" data-mode="type">Typen</button></div></div>`); break;
    case 'word-new': closeSheet(); wordForm(d.set); break;
    case 'flip': FLASH.flipped = true; flashRender(); break;
    case 'flash-grade': grade('w:' + FLASH.ids[FLASH.i] + ':rec', d.ok === '1'); if (d.ok === '1') FLASH.knew++; FLASH.i++; FLASH.flipped = false; flashRender(); break;
    case 'export': exportData(); break;
    case 'praten': if (el.getAttribute('aria-disabled') === 'true') { toast('Doe eerst alle pleinen van deze stad.'); break; } closeSheet(); openPraten({mode: d.mode, q: d.q, u: d.u}); break;
    case 'verslag': openReport(); break;
    case 'docs': closeOverlay('welcome'); openDocs(); break;
    case 'doc-save': saveDoc(d.id); break;
    case 'export-text': copyBackup(); break;
    case 'import': $('#imp-file').click(); break;
    case 'reset': confirmBox('Alle voortgang, sets en eigen woorden wissen?', 'Wis alles', () => { S = blankState(); Store.mark('state', 'items', 'words'); render(); toast('Alles gewist'); }); break;
    case 'sheet-close': closeSheet(); break;
    case 'fclose': closeFeed(); break;
    case 'faudio': S.settings.autoAudio = !S.settings.autoAudio; el.textContent = S.settings.autoAudio ? 'Geluid aan' : 'Geluid uit'; Store.mark('state'); break;
    case 'fans': feedAnswer(d.fid, d.v); break;
    case 'flis': feedListen(d.fid, d.j); break;
    case 'freveal': { const sec = el.closest('.fcard'); $('.fback', sec).hidden = false; el.hidden = true; const g = $('.fgrade', sec); if (g) g.hidden = false; break; }
    case 'fknew': feedKnew(d.fid, d.ok === '1'); break;
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', {bubbles: true})); }
  if (e.key === 'Escape') { if ($('#sheetback')) closeSheet(); }
});
document.addEventListener('submit', e => { if (e.target.id === 'ex-form') { e.preventDefault(); submitAnswer($('#ex-in').value); } });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ex-in') { const er = $('#ex-err'); if (er) er.hidden = true; }
  if (t.id === 'wsearch') { WQ = t.value; $('#wlist').innerHTML = wordList() + dictHits(WQ); }
  if (t.id === 'nw-w') { clearTimeout(t._dt); t._dt = setTimeout(() => dictFillForm(t), 350); }
  if (t.id === 'nsearch') { NQ = t.value; naslagFilter(); }
  if (t.id === 'set-rate') { S.settings.rate = Number(t.value); $('#rate-out').textContent = t.value; Store.mark('state'); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'set-voice') { S.settings.voice = t.value; Store.mark('state'); Audio.say('Hallo, ik ben je stem.'); }
  if (t.id === 'set-cap') { S.settings.cap = Number(t.value); Store.mark('state'); }
  if (t.id === 'set-start') { S.settings.startView = t.value; Store.mark('state'); }
  if (t.id === 'set-tour') { S.settings.tourOnStart = t.checked; Store.mark('state'); }
  if (t.id === 'set-tips') { S.settings.tips = t.checked; Store.mark('state'); render(); }
  if (t.id === 'set-test') { S.settings.test = t.checked; Store.mark('state'); render(); toast(t.checked ? 'Testmodus aan: alles is open' : 'Testmodus uit: pleinen gaan in volgorde open'); }
  if (t.id === 'imp-file' && t.files[0]) importData(t.files[0]);
});

/* ===== INIT ===== */
(function init() {
  let first = false; try { first = !localStorage.getItem(LS_KEY) && !localStorage.getItem(LS_OLD); } catch (e) {}
  Store.loadLocal(); Audio.load(); dripRelease();
  if (first) Store.persist();
  registerSW();
  render();
  setTimeout(() => { if (TAB === 'ik') render(); }, 800);
  if (location.hash === '#feed') { openFeed(); return; }
  if (!S.coach.tour && !S.savedAt) openWelcome(); else if (S.settings.tourOnStart) openTour(0); else if (S.settings.startView !== 'pad' && !$('.overlay')) openFeed();
})();


</script>
</body>
</html>
