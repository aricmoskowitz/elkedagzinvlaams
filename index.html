<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Elke Dag Zin</title>
<meta name="description" content="Elke dag een beetje Vlaams: zinnen, woorden en herhalingen.">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dagzin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon192.png">
<link rel="apple-touch-icon" href="icon180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Work+Sans:wght@400;500;600&family=Pixelify+Sans:wght@500;700&display=swap">
<script>const APP_VERSION = "b26cf02da7";</script>
<style>
/* Colour has three jobs only:
   green  = you can tap this (filled = the one thing to do next)
   blue / red = de / het
   gold   = the verb (slot 2 and the verb end: the "verb bracket")
   Everything else is ink on white. */
:root{
  --bg:#FFFFFF; --ink:#1E1B16; --ink2:#6B665E; --faint:#A9A49A; --line:#E7E3DC; --soft:#F6F4F0;
  --go:#2F6B3A; --go-dark:#24542D; --go-tint:#EAF2EA;
  --de:#23408E; --het:#B03A2E; --de-tint:#E8ECF6; --het-tint:#F8E7E4;
  --verb:#8A5D10; --verb-fill:#F3E4C2; --verb-line:#C99A3A;
  --warn:#8A5A2B; --warn-tint:#F7EFE3;
  --display:'Fraunces', Georgia, 'Times New Roman', serif;
  --ui:'Work Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;font-variation-settings:'opsz' 72}
h1{font-size:28px} h2{font-size:22px} h3{font-size:18px}
.nl{font-family:var(--display);font-variation-settings:'opsz' 36}
.de{color:var(--de)} .het{color:var(--het)}
.small{font-size:13px;color:var(--ink2)}
.muted{color:var(--ink2)}
.label{font-size:13px;color:var(--ink2);font-weight:500}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
@supports (height:100dvh){#app{height:100dvh}}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(20px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) 32px calc(16px + env(safe-area-inset-left,0px))}
#tabs{display:flex;border-top:1px solid var(--line);background:var(--bg);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#tabs button{flex:1;border:0;background:transparent;padding:12px 2px 14px;font-size:13px;font-weight:500;color:var(--ink2);min-height:52px;-webkit-touch-callout:none;user-select:none;position:relative}
#tabs button.on{color:var(--ink)}
#tabs button.on::after{content:'';position:absolute;left:30%;right:30%;bottom:8px;height:2px;background:var(--ink);border-radius:1px}

.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.soft{background:var(--soft);border-color:var(--soft)}

/* buttons: green means tappable */
.btn{border:1.5px solid var(--go);background:var(--go);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;min-height:48px;-webkit-touch-callout:none}
.btn:active{background:var(--go-dark)}
.btn.line{background:var(--bg);color:var(--go)}
.btn.block{width:100%}
.btn.quiet{border-color:var(--line);background:var(--bg);color:var(--ink)}
.link{border:0;background:none;color:var(--go);font-weight:600;cursor:pointer;padding:10px 0;min-height:44px;text-align:left}
.tapline{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.tapline .t{flex:1;min-width:0}
.tapline .chev{color:var(--go);font-size:22px;line-height:1}
.back{border:0;background:none;color:var(--go);font-weight:600;cursor:pointer;padding:8px 0;min-height:44px;font-size:15px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;min-height:34px;color:var(--ink)}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--ink2)}
.pill.test{background:var(--warn-tint);color:var(--warn)}
.iconbtn{border:0;background:transparent;width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--go);outline-offset:2px}
button[disabled]{opacity:.45}
input[type=text],input[type=search],textarea,select{font:inherit;font-size:17px;width:100%;border:1px solid #CFCAC1;background:#fff;border-radius:10px;padding:11px 12px;color:var(--ink)}
input.big{font-family:var(--display);font-size:22px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}

/* today */
.hero{border:1.5px solid var(--go);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.dateline{font-size:14px;color:var(--ink2)}
.big-num{font-family:var(--display);font-size:32px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.weekbar{display:flex;gap:4px}
.weekbar span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.weekbar span.on{background:var(--ink)}

/* map */
.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.maptown{cursor:pointer}
.maptown text{font-family:var(--display)}

/* coach tips */
.tip{border-left:3px solid var(--go);background:var(--go-tint);border-radius:0 12px 12px 0;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.tip .link{padding:4px 0;min-height:32px;align-self:flex-start}
.howto{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}

/* overlays */
.overlay{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.overlay .ohead{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line)}
.overlay .obody{flex:1;overflow-y:auto;padding:20px 16px 32px;-webkit-overflow-scrolling:touch}
.overlay .obody > .inner{max-width:560px;margin:0 auto}
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(30,27,22,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 12px}
.progress{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress > div{height:100%;background:var(--ink);transition:width .3s}

/* exercises */
.ex-label{font-size:13px;color:var(--ink2);font-weight:500}
.ex-prompt{font-family:var(--display);font-size:24px;line-height:1.3;font-variation-settings:'opsz' 48}
.ex-sub{color:var(--ink2);font-size:15px}
.blank{display:inline-block;min-width:3em;border-bottom:2px solid var(--ink);color:transparent}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1.5px solid var(--go);background:var(--bg);color:var(--ink);border-radius:12px;padding:13px 14px;text-align:left;font-family:var(--display);font-size:19px;cursor:pointer;min-height:50px}
.opt[disabled]{opacity:1;border-color:var(--line)}
.opt.right{border-color:var(--go);background:var(--go-tint)}
.opt.wrong{border-color:var(--warn);background:var(--warn-tint);text-decoration:line-through}
.dehet{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dehet button{font-family:var(--display);font-size:26px;border-radius:12px;padding:16px;border:2px solid;cursor:pointer;background:var(--bg);min-height:64px}
.dehet .d{border-color:var(--de);color:var(--de)} .dehet .h{border-color:var(--het);color:var(--het)}
.dehet .d.pick{background:var(--de);color:#fff} .dehet .h.pick{background:var(--het);color:#fff}
.dehet button[disabled]{opacity:1}
.tokens{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:8px;border-radius:12px}
.tokens.answer{border:1.5px dashed #CFCAC1}
.tok{font-family:var(--display);font-size:18px;border:1.5px solid var(--go);background:var(--bg);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:44px;color:var(--ink)}
.tokens.answer .tok{border-color:var(--ink)}
.tok.used{visibility:hidden}
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--go-tint)}
.fb.no{background:var(--warn-tint)}
.fb h3{font-size:20px}
.fb .answer{font-family:var(--display);font-size:20px}
.why{font-size:15px;line-height:1.55}
.why i{font-family:var(--display)}
.speak{border:1.5px solid var(--go);background:var(--bg);color:var(--go);border-radius:50%;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}

/* sentence frame: gold = the verb bracket */
.frame{display:flex;flex-wrap:wrap;gap:4px;font-size:14px}
.frame .slot{display:flex;flex-direction:column;gap:3px;min-width:56px;flex:1 1 auto}
.frame .slot .lab{font-size:11px;color:var(--ink2);padding-left:2px}
.frame .slot .box{border-radius:8px;padding:7px 8px;font-family:var(--display);font-size:16px;min-height:36px;background:var(--soft)}
.frame .s2 .box,.frame .s4 .box{background:var(--verb-fill);color:var(--verb);box-shadow:inset 0 0 0 1.5px var(--verb-line)}
.frame .empty .box{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--faint);font-family:var(--ui);font-size:12px}
.frame u{text-decoration-thickness:2px;text-underline-offset:3px}
.verbword{color:var(--verb);font-weight:600}

/* word card */
.wc-word{font-family:var(--display);font-size:34px;font-weight:600;line-height:1.1;font-variation-settings:'opsz' 96}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:0}
.kv dt{color:var(--ink2)} .kv dd{margin:0;font-family:var(--display)}
.conj{width:100%;border-collapse:collapse;font-size:15px}
.conj td{padding:6px 4px;border-bottom:1px solid var(--line)}
.conj td:first-child{color:var(--ink2);width:44%}
.conj td:last-child{font-family:var(--display);font-size:17px;color:var(--verb)}
.conj tr.spoken td{color:var(--faint)}
.conj .head td{color:var(--ink);font-weight:600;font-family:var(--ui);font-size:13px;padding-top:12px;border-bottom:0}
.en-hidden{border:1.5px dashed var(--go);border-radius:8px;padding:6px 10px;background:transparent;color:var(--go);cursor:pointer;font-size:14px;font-weight:500}
.list .li{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer;min-height:48px}
.list .li .w{font-family:var(--display);font-size:18px}
.list .li .d{font-size:13px;color:var(--ink2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.flash{min-height:300px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;cursor:pointer;border:1.5px solid var(--go)}

.bar{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--ink)}
.bar.soon{color:var(--faint)}
.bar .num{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink2)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.switch input{width:22px;height:22px;accent-color:var(--go)}

/* tour */
.tour{display:flex;flex-direction:column;gap:18px;padding-top:12px}
.tour .dots{display:flex;gap:6px;justify-content:center}
.tour .dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tour .dots span.on{background:var(--ink)}
.tour svg{width:100%;height:auto;max-height:220px}

/* feed */
#feed{position:fixed;inset:0;z-index:35;background:var(--soft)}
#feed .fhead{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;pointer-events:none}
#feed .fhead > *{pointer-events:auto}
#feed .fscroll{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.fcard{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:64px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.fcard .fin{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;min-height:56%;justify-content:center;border:1px solid var(--line)}
.fcard .kind{font-size:13px;color:var(--ink2);font-weight:500}

#tip{position:fixed;z-index:60;background:var(--ink);color:#fff;font-size:13px;padding:6px 10px;border-radius:8px;pointer-events:none;max-width:240px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:90%}
[data-en]{-webkit-touch-callout:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.eyebrow{font-size:13px;color:var(--ink2);font-weight:500}
.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--ink2)}

/* overworld */
.world{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--ink);background:#A9D38C}
.world canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.world svg{position:absolute;inset:0;width:100%;height:100%}
.world .wtown{cursor:pointer}
.px{font-family:'Pixelify Sans','Courier New',monospace;font-size:11px;font-weight:700;letter-spacing:.04em}
.bob{animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.floatcard{position:sticky;bottom:8px;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:10px 12px;box-shadow:0 6px 18px rgba(30,27,22,.16)}
.floatcard .t{flex:1;min-width:0}

/* batch 2 */
.bubble{max-width:86%;border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start;flex-direction:column}
.bubble .nl{font-size:18px;line-height:1.4}
.bubble.tutor{background:var(--soft);align-self:flex-start}
.bubble.tutor .speak{width:34px;height:34px}
.bubble.me{background:#fff;border:1.5px solid var(--line);align-self:flex-end}
.fixnote{border-left:3px solid var(--warn);background:var(--warn-tint);padding:6px 8px;border-radius:0 8px 8px 0;font-size:15px}
.talkbar{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding:8px 0 4px}
.talkbar textarea{flex:1;font-family:var(--display);font-size:18px}
.corr{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.corr input{width:22px;height:22px;accent-color:var(--go);flex:none;margin-top:2px}
.corr .wrong{text-decoration:line-through;color:var(--ink2)}
.corr .right{font-size:17px}
.dots{display:inline-flex;gap:3px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink2);animation:blink 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.conj td.eyebrow{color:var(--ink2)!important;font-family:var(--ui)!important;font-size:13px!important}
/* plan placement */
.loc{font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--ink2);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pill.new{background:var(--verb-fill);color:var(--verb)}
.pill.go{background:var(--go-tint);color:var(--go)}
.placecard{border-left:4px solid var(--go)}
.placecard .corr:last-of-type{border-bottom:0}
.savebar{position:sticky;bottom:0;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 30%);padding:18px 0 10px;margin-top:-8px}
details.card summary{list-style:none} details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:' ›';color:var(--go);font-weight:600}
.planarc{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.planarc h2 .small{font-family:var(--ui);font-weight:500}
.plantown{border:1px solid var(--line);border-radius:14px;padding:12px 12px 4px}
.planrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;min-height:48px;cursor:pointer}
.planrow .t{flex:1;min-width:0}
.planrow .pn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink2)}
.planrow.added .pn{background:var(--verb-fill);color:var(--verb)}
.planrow.focus{background:var(--go-tint);border-radius:10px}
.badge{flex:none;min-width:22px;height:22px;border-radius:11px;background:var(--go);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 6px}
.st{flex:none;font-size:11px;font-weight:600;color:var(--faint);min-width:52px;text-align:right}
.st.klaar,.st.bezig,.st.open{color:var(--go)}
.st.toegevoegd{color:var(--verb)}
.planborder{text-align:center;color:var(--ink2);padding:6px 0 4px;font-style:italic}
.mine{border-left:4px solid var(--verb-line)}
.mine .corr{cursor:default}
.link.sm{font-size:14px;padding:2px 0;min-height:32px}
.procsum{font-size:15px;color:var(--ink)}
.usedrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 0;min-height:44px;cursor:pointer}
.usedrow:first-of-type{border-top:0}
.usedrow .loc{flex:none;width:44px}
.usedrow .t{flex:1;min-width:0}
.usedrow .chev{color:var(--go)}
.deel{display:flex;flex-direction:column;gap:10px;margin-top:10px}
details.planarc{border:0;gap:10px}
details.planarc>summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 12px;border-radius:12px;background:var(--soft);min-height:48px;font-family:var(--display);font-size:18px}
details.planarc>summary::-webkit-details-marker{display:none}
details.planarc>summary .t{flex:1}
details.planarc>summary .small{font-family:var(--ui)}
details.planarc>summary::after{content:'›';color:var(--go);font-weight:600;transition:transform .15s}
details.planarc[open]>summary::after{transform:rotate(90deg)}
details.planarc[open]{display:flex;flex-direction:column}
.plantown .cando{font-style:italic;margin-bottom:4px}
.planrow.review .pn{background:var(--go-tint);color:var(--go)}
/* batch 3 */
.readtext{font-size:19px;line-height:1.65}
.rw{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-color:var(--go);text-decoration-thickness:1.5px;text-underline-offset:4px;cursor:pointer}
.marktline .pn.star,.pn.star{flex:none;width:28px;height:28px;border-radius:50%;background:var(--go-tint);color:var(--go);display:grid;place-items:center;font-size:14px}
/* v1.5: words, cards, curriculum */
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15px;background:var(--soft);border-radius:12px;padding:12px 14px}
.facts dt{color:var(--ink2);font-size:13px;align-self:center}
.facts dd{margin:0;font-family:var(--display);font-size:17px}
details.more>summary{cursor:pointer;color:var(--go);font-weight:600;padding:6px 0;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:' ›'}
.rw.new{text-decoration-color:var(--faint);text-decoration-style:dotted}
.rw.hl{font-weight:700}
.swipe-wrap{position:relative;padding:8px 0}
.swipe-hint{position:absolute;top:20px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:0;transition:opacity .15s}
.swipe-hint.left{left:4px;color:var(--warn)} .swipe-hint.right{right:4px;color:var(--go)}
.swipe-wrap.lean-left .swipe-hint.left,.swipe-wrap.lean-right .swipe-hint.right{opacity:1}
.swipe-wrap.lean-left .fcard2{border-color:var(--warn)} .swipe-wrap.lean-right .fcard2{border-color:var(--go)}
.fcard2{min-height:340px;border:2px solid var(--line);border-radius:20px;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:22px 18px;text-align:center;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;box-shadow:0 6px 18px rgba(30,27,22,.08)}
.fcard2.flipped{background:var(--soft)}
.fcard2 .face{width:100%}
.fcard2 .facts{text-align:left}
.btn.warnline{border-color:var(--warn);color:var(--warn);background:#fff}
details.nsq,details.ntown{border-top:1px solid var(--line)}
details.nsq>summary,details.ntown>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 2px;min-height:48px;cursor:pointer}
details.nsq>summary::-webkit-details-marker,details.ntown>summary::-webkit-details-marker{display:none}
details.nsq>summary .t,details.ntown>summary .t{flex:1;min-width:0}
details.nsq>summary .pn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink2)}
details.ntown>summary::after,details.nsq>summary::after{content:'›';color:var(--go);font-weight:600;transition:transform .15s}
details.ntown[open]>summary::after,details.nsq[open]>summary::after{transform:rotate(90deg)}
details.ntown{padding:0 4px}
details.ntown>.nbody{padding:0 0 10px 6px}
details.nsq>.nbody{padding:4px 4px 14px 34px}
details.nsq.focus>summary{background:var(--go-tint);border-radius:10px}
details.narc{display:flex;flex-direction:column}
[hidden]{display:none!important}

/* 2.0: update toast */
#update{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;padding:6px 8px 6px 16px;border-radius:12px;font-size:14px;box-shadow:0 6px 18px rgba(30,27,22,.2)}
#update .link{color:#fff;text-decoration:underline;min-height:40px;padding:0 10px}
a.btn{text-decoration:none;text-align:center;box-sizing:border-box}

u1:{title:'Het werkwoord op plaats 2',en:'Verb second · inversion',
 body:[
 'In a Dutch main clause the conjugated verb (<i>de persoonsvorm</i>) always sits in <b>slot 2</b>. Slot 1 can hold the subject, but also a time, a place or a question word.',
 'When something other than the subject takes slot 1, the subject moves to <b>just after the verb</b>. This is called <i>inversie</i>: <i>Ik neem morgen de tram</i> → <i>Morgen neem <u>ik</u> de tram</i>.',
 'Yes/no questions and commands leave slot 1 empty, so the verb comes first: <i>Neem jij de tram?</i> · <i>Ga rechtdoor.</i>',
 'When <i>jij/je</i> comes after the verb, the verb loses its <i>-t</i>: <i>jij neemt</i> but <i>neem jij?</i>'],
 why:'Dutch keeps the old Germanic “verb-second” rule, as German does. English lost it, except in fossils like “Here comes the tram” or “Never have I seen that”.',
 ex:['u1s2','u1s1','u1s3','u1s7']},
u2:{title:'Scheidbare werkwoorden',en:'Separable verbs',
 body:[
 'Many verbs have a small stressed prefix: <i><b>mee</b>nemen, <b>op</b>bellen, <b>uit</b>stappen, <b>af</b>rekenen</i>.',
 'In a main clause the conjugated part goes to <b>slot 2</b> and the prefix drops to the <b>end</b> (slot 4): <i>Ik <u>neem</u> de plant <u>mee</u>.</i>',
 'As an infinitive the verb stays in one piece: <i>Ik wil de plant meenemen.</i> In the participle, <i>ge-</i> slips in between: <i>mee<b>ge</b>nomen</i>.',
 'The stress tells you: <i>MEEnemen</i> (separable) versus <i>beSTELlen</i> (not separable, stress on the root).'],
 why:'The prefix is really a small adverb that grew onto the verb, like English “pick the flowers <u>up</u>”. Dutch sends it to the end of the clause, the same place other verb parts go.',
 ex:['u2s1','u2s8','u2s13','u2s10']},
u3:{title:'De of het? · verkleinwoorden',en:'De or het · diminutives',
 body:[
 'Dutch has two words for “the”: <b style="color:var(--de)">de</b> and <b style="color:var(--het)">het</b>. About two thirds of nouns are <i>de</i>.',
 '<b>Four rules that always work:</b> (1) every plural is <i>de</i>; (2) every diminutive in <i>-je</i> is <i>het</i>; (3) a compound takes the article of its last part: <i>het frietkot</i> because <i>het kot</i>; (4) days, months and people doing a job are <i>de</i>.',
 'Diminutive endings: <i>-je</i> (broodje), <i>-tje</i> after a vowel or l/n/r/w (koffietje), <i>-pje</i> after m (boompje), <i>-etje</i> after a short vowel + l, m, n, r, ng (bloemetje, bruggetje).',
 'In Antwerp you will also hear <i>-ke</i> and <i>-ske</i>: <i>een zakske, een manneke</i>.',
 'For everything else: learn each noun <i>with</i> its article. That’s why the app colours it every time.'],
 why:'Old Dutch had three genders. Masculine and feminine merged into <i>de</i>; <i>het</i> is the old neuter. Diminutives were always neuter, which is why even <i>het meisje</i> (the girl) is <i>het</i>, like German <i>das Mädchen</i>.',
 ex:['u3s4','u3s13','u3s1','u3s5']},
};

u6:{title:'Bijvoeglijke naamwoorden op -e',en:'Adjective endings',body:[],why:'Old Dutch had many adjective endings, like German. They wore down to one: <i>-e</i>. The only place it disappears is before a single neuter noun with <i>een</i> or no article, which is exactly where German still uses a special neuter ending.',ex:['u6s1']},

/* ===== CHECKER ===== */
function check(ex, input) {
  if (ex.type === 'mc' || ex.type === 'gen') {
    const ok = norm(input) === norm(ex.answer);
    return {ok, kind: ok ? 'ok' : (ex.type === 'gen' ? 'article' : 'word')};
  }
  const n = norm(input);
  const cand = ex.accept;
  if (cand.includes(n)) return {ok: true, kind: 'ok'};
  if (cand.map(deacc).includes(deacc(n))) return {ok: true, kind: 'accent', note: 'Let op de accenten.'};
  if (!ex.whole && ex.lex && ex.lex.p === 'n') {
    const m = n.match(/^(de|het|een)\s+(.*)$/);
    if (m && cand.includes(m[2])) {
      if (m[1] !== 'een' && ex.lex.g && m[1] !== ex.lex.g && !(ex.lex.pl && m[2] === norm(ex.lex.pl))) return {ok: false, kind: 'article'};
      return {ok: true, kind: 'ok'};
    }
  }
  if (ex.whole) {
    const ws = n.split(' ').sort().join(' ');
    if (cand.some(c => c.split(' ').sort().join(' ') === ws)) return {ok: false, kind: 'order'};
    const swap = n.split(' ').map(w => w === 'de' ? 'het' : w === 'het' ? 'de' : w);
    for (let i = 0; i < swap.length; i++) {
      const w = n.split(' '); if (w[i] === 'de' || w[i] === 'het') { w[i] = w[i] === 'de' ? 'het' : 'de'; if (cand.includes(w.join(' '))) return {ok: false, kind: 'article'}; }
    }
  }
  if (ex.lex && ex.lex.v) {
    const forms = allForms(ex.lex); const f = vForms(ex.lex);
    const n2 = f.sep ? n.replace(new RegExp('\\s*' + f.sep + '$'), '') : n;
    if (forms.includes(n2) || forms.includes(n)) return {ok: false, kind: 'form'};
  }
  const best = Math.min(...cand.map(c => lev(deacc(n), deacc(c))));
  const len = (cand[0] || '').length;
  const tol = ex.whole ? Math.max(2, Math.floor(len * 0.07)) : len >= 8 ? 2 : len >= 4 ? 1 : 0;
  if (best <= tol) return {ok: true, kind: 'typo', note: 'Bijna: let op de spelling.'};
  return {ok: false, kind: 'word'};
}
function whyFor(ex, res) {
  if (res.kind === 'article' && ex.lex) return genWhy(ex.lex);
  if (res.kind === 'form' && ex.lex) return (ex.conjP ? personRule(ex.conjP) + ' ' : '') + ex.why;
  return ex.why;
}

const backupName = () => 'elkedagzin-backup-' + dateKey() + '.json';
function backupText() { Store.flush(); return JSON.stringify(S, null, 1); }
function backupDone() { S.settings.lastBackup = Date.now(); Store.mark('state'); render(); }
async function exportData() {
  let r; try { r = await saveFile(backupName(), backupText(), 'application/json'); } catch (e) { return copyBackup(); }
  if (r === 'cancelled') return;
  backupDone(); toast(r === 'shared' ? 'Back-up bewaard' : 'Back-up gedownload');
}
function copyBackup() {
  const data = backupText();
  const s = openSheet(`<div class="stack"><h2>Back-up als tekst</h2><div class="small">Kopieer deze tekst en bewaar hem in een notitie. Terugzetten kan met <i>Zet back-up terug</i> als je hem als .json-bestand bewaart.</div><textarea id="exp-t" rows="8" readonly>${esc(data)}</textarea><button class="btn block" id="exp-copy">Kopieer</button></div>`);
  s.querySelector('#exp-copy').onclick = () => { const t = s.querySelector('#exp-t'); navigator.clipboard.writeText(t.value).then(() => { backupDone(); toast('Gekopieerd'); }, () => { t.select(); toast('Selecteer en kopieer de tekst'); }); };
}
// a 1.5 backup is the same state shape (v 2); a 2.0 backup is v 3
function parseBackup(text) {
  let d; try { d = JSON.parse(String(text).replace(/^\uFEFF/, '')); } catch (e) { return {error: 'Dit bestand is geen geldige back-up.'}; }
  if (!d || typeof d !== 'object' || Array.isArray(d) || !d.items || typeof d.items !== 'object') return {error: 'Dit bestand is geen back-up van Elke Dag Zin.'};
  return {data: d};
}
function restoreBackup(d) {
  S = Object.assign(blankState(), JSON.parse(JSON.stringify(d))); migrate();
  S.savedAt = Date.now(); Store.flush();
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    const res = parseBackup(r.result); if (res.error) { toast(res.error); return; }
    confirmBox('Je huidige voortgang vervangen door deze back-up?', 'Vervang', () => { restoreBackup(res.data); closeOverlay('tour'); render(); toast('Back-up teruggezet'); });
  };
  r.onerror = () => toast('Het bestand kon niet gelezen worden');
  r.readAsText(file);
}
// a quiet reminder on Pad after 14 days without a backup (not before there is progress)
function backupReminder() {
  const last = S.settings.lastBackup || 0; const hasProgress = Object.keys(S.items).length > 0;
  if (!hasProgress || Date.now() - last < 14 * 864e5) return '';
  return `<button class="tapline" data-act="export"><div class="t"><div style="font-weight:600">Maak een back-up</div><div class="small">${last ? 'Je laatste back-up is van ' + Math.floor((Date.now() - last) / 864e5) + ' dagen geleden' : 'Je hebt nog geen back-up gemaakt'}. Je voortgang staat alleen op deze telefoon.</div></div><span class="chev">›</span></button>`;

function closeFeed() {

  const a = S.activity[dateKey()] = S.activity[dateKey()] || {n: 0, m: 0}; a.m = Math.round(((a.m || 0) + (Date.now() - FEED.t0) / 60000) * 10) / 10;
  Store.mark('state', 'items'); $('#feed').remove(); FEED = null; render();
}
function feedPlan() {
  const intro = Object.keys(S.items).filter(k => /^w:.*:(rec|gen)$/.test(k) && keyValid(k));
  const due = shuffle(intro.filter(isDue)), fam = shuffle(intro.filter(k => !isDue(k)));
  let qs = due.slice(0, 11); if (qs.length < 11) qs = qs.concat(fam.slice(0, 11 - qs.length));
  if (qs.length < 11) {
    for (const l of LEX) { if (qs.length >= 11) break; if (!S.items['w:' + l.id + ':rec'] && S.seen[l.id]) qs.push('w:' + l.id + ':' + (l.g && Math.random() < .5 ? 'gen' : 'rec')); }
  }
  const newL = LEX.filter(l => !S.seen[l.id]).slice(0, qs.length < 6 ? 4 : 2);
  const started = UNITS.filter(u => u.built && unitStarted(u.id)).map(u => u.n); if (!started.length) started.push(1);
  const sents = shuffle(SENT.filter(s => started.includes(s.u)));
  const verbs = shuffle(LEX.filter(l => l.v && (S.seen[l.id] || started.includes(l.u))));
  const nouns = shuffle(LEX.filter(l => l.p === 'n' && (S.seen[l.id] || started.includes(l.u))));
  const glances = [{kind: 'gv', l: verbs[0]}, {kind: 'gf', s: sents[0]}, {kind: 'gn', l: nouns[0]}].filter(g => g.l || g.s);
  const xs = shuffle(EXTRAS.filter(x => !FEED.usedX.has(x.title))).slice(0, 2); xs.forEach(x => FEED.usedX.add(x.title));
  if (FEED.usedX.size >= EXTRAS.length) FEED.usedX.clear();
  const pattern = ['q', 'q', 'w', 'q', 'x', 'q', 'g', 'q', 'l', 'n', 'q', 'q', 'x', 'q', 'g', 'w', 'q', 'l', 'n', 'q'];
  const out = []; let qi = 0, xi = 0, gi = 0, li = 0, ni = 0;
  const gl = shuffle(glances);
  pattern.forEach(p => {
    if (p === 'q' && qs[qi]) out.push({kind: 'q', key: qs[qi++]});
    else if (p === 'w' && qs[qi]) { const id = qs[qi++].split(':')[1]; out.push({kind: 'w', l: LX(id)}); }
    else if (p === 'x' && xs[xi]) out.push({kind: 'x', x: xs[xi++]});
    else if (p === 'g' && gl[gi]) out.push(gl[gi++]);
    else if (p === 'l' && sents[1 + li]) out.push({kind: 'l', s: sents[1 + li++]});
    else if (p === 'n' && newL[ni]) out.push({kind: 'n', l: newL[ni++]});
    else if (newL[ni]) out.push({kind: 'n', l: newL[ni++]});
  });
  while (newL[ni]) out.push({kind: 'n', l: newL[ni++]});
  out.push({kind: 'b'});
  return out;
}

/* ===== PLAN PLACEMENT: every mistake and word gets a place in the plan =====
   Boog · Stad · Plein. Built squares, planned squares (not built yet) and
   squares you added from your own log/talks ("toegevoegd") all count. */

/* ---------- where things live ---------- */
const FORM_IX = (() => {
  const ix = {};
  const add = (f, id) => { const k = norm(f); if (k && k.length > 1 && !ix[k]) ix[k] = id; };
  LEX.forEach(l => { [l.w, l.pl, l.dim, l.e].forEach(f => f && add(f, l.id)); if (l.v) allForms(l).forEach(f => add(f, l.id)); });
  return ix;
})();
const SQ_OF_WORD = (() => { const m = {}; PLAN_SQ.forEach(q => (q.words || []).forEach(w => { m[w] = q.id; })); return m; })();
function planLoc(id) {
  if (!id) return null;
  if (PSQ[id]) { const q = PSQ[id]; const t = PT[q.u]; return {id, kind: q.built ? 'built' : 'planned', arc: arcOf(q.u).n, town: townIndexInArc(q.u), townName: t.name, sq: q.n, sqName: q.name, title: q.title, en: q.en, u: q.u}; }
  const x = (S.extras || []).find(e => e.id === id);
  if (x) { if (!x.town || !PT[x.town]) return {id, kind: 'added', arc: null, town: null, townName: 'Nog niet geplaatst', sq: null, sqName: 'Toegevoegd', title: x.title, en: '', u: null};
    return {id, kind: 'added', arc: arcOf(x.town).n, town: townIndexInArc(x.town), townName: PT[x.town].name, sq: null, sqName: 'toegevoegd plein', title: x.title, en: '', u: x.town}; }
  return null;
}
function locLine(L) { if (!L) return 'Algemeen'; return L.arc ? `Boog ${L.arc} · Stad ${L.town} · ${L.sq ? 'Plein ' + L.sq : 'toegevoegd'}` : 'Nog niet geplaatst'; }
function locStatus(L) {
  if (!L) return '';
  if (L.kind === 'added') return 'toegevoegd';
  if (PSQ[L.id] && PSQ[L.id].review) return PSQ[L.id].built ? marktStatus(L) : 'later';
  if (L.kind === 'planned') return 'later';
  if (sqComplete(L.id)) return 'klaar';
  if (!sqOpen(L.id)) return 'nog dicht';
  return sqStarted(L.id) ? 'bezig' : 'open';
}
const planOrder = id => { const i = PLAN_SQ.findIndex(q => q.id === id); if (i >= 0) return i; const x = (S.extras || []).find(e => e.id === id); if (x && x.town) { const j = PLAN_SQ.findIndex(q => q.u === x.town); return j + 2.5; } return 9999; };
function usedPlanWords(text) {
  const seen = new Set(), out = [];
  norm(text).split(' ').forEach(t => { const id = FORM_IX[t]; if (id && !seen.has(id)) { seen.add(id); out.push(id); } });
  return out;
}
function mineFor(id) {
  id = id || null;
  const fixes = Object.entries(S.fix || {}).filter(([, f]) => (f.plan || null) === id).map(([k, f]) => ({k, ...f}));
  const words = Object.values(S.custom || {}).filter(w => (w.plan || null) === id);
  return {fixes, words};
}
function mineCountTown(u) {
  let n = 0; PLAN_SQ.filter(q => q.u === u).forEach(q => { const m = mineFor(q.id); n += m.fixes.length + m.words.length; });
  (S.extras || []).filter(x => x.town === u).forEach(x => { const m = mineFor(x.id); n += m.fixes.length + m.words.length + 1; });
  return n;
}

  };

    ${o.tip ? `<div class="small"><b>Tip:</b> ${esc(o.tip)}</div>` : ''}
    <div class="savebar"><button class="btn block" id="proc-save">Bewaar in mijn plan</button></div>

    }

      if (g.newTopic && g.newTopic.title) topicId(topicKey(g.newTopic));
      if (PSQ[g.plan] && !(PSQ[g.plan].built && sqComplete(g.plan))) S.sic[g.plan] = {topic: g.topic, date: dateKey()};
      if (PSQ[g.plan] && PSQ[g.plan].built && sqComplete(g.plan)) squareKeys(g.plan).forEach(k => { if (S.items[k]) S.items[k].d = today(); });

const arr = a => Array.isArray(a) ? a : [];

function practiseMine(id) {

/* ---------- the whole plan ---------- */

/* ---------- harder rounds in the Oefen house ---------- */
const ROUNDS = {2: {name: 'Ronde 2 · moeilijker', desc: 'Alle woorden zelf typen, de/het en vervoegen, alle zinnen bouwen'}, 3: {name: 'Ronde 3 · uit het hoofd', desc: 'Zinnen uit het Engels, zonder blokjes'}};
function roundKeys(q, r) {
  const sq = SQ[q]; const lex = sq.words.map(LX); const ks = [];
  if (r === 2) { lex.forEach(l => { ks.push('w:' + l.id + ':prod'); if (l.g) ks.push('w:' + l.id + ':gen'); if (l.v) ks.push('w:' + l.id + ':conj'); }); sq.sents.forEach(id => ks.push('s:' + id + ':ord')); return shuffle(ks).slice(0, 18); }
  sq.sents.forEach(id => ks.push('s:' + id + ':tr')); lex.forEach(l => ks.push('w:' + l.id + ':prod'));
  return shuffle(ks.slice(0, sq.sents.length)).concat(shuffle(ks.slice(sq.sents.length)).slice(0, 4)).slice(0, 14);
}
function roundsBlock(q) {
  if (!stepDone(q, 'oefen')) return '';
  const got = (S.sq[q].rounds || {}).oefen || 1;
  return `<div class="card stack" style="gap:4px"><div class="eyebrow">Oefen opnieuw, moeilijker</div>${[2, 3].map(r => { const open = r <= got + 1 || testMode(); const done = got >= r;

}
function startRound(q, r) {
  const got = (S.sq[q] && S.sq[q].rounds || {}).oefen || 1;
  if (r > got + 1 && !testMode()) { toast('Haal eerst ronde ' + (r - 1) + '.'); return; }
  startSession({keys: roundKeys(q, r), sq: q, step: 'oefen', round: r, intros: false});
}

/* ===== BATCH 3 · Lees house, Grote Markt ===== */

/* ---------- Lees: one short text per square ---------- */
ACTIVE_STEPS.push('lees');
STEP_DESC.lees = 'Een korte tekst met drie vragen';
function startStep(q, step) {
  if (!sqOpen(q)) { toast('Dit plein is nog dicht. Doe eerst het vorige, of test je erin.'); return; }
  S.cur = q; Store.mark('state');
  if (step === 'ontdek') return openLesson(q);
  if (step === 'oefen') return startSession({keys: practiceKeys(q), sq: q, step: 'oefen'});
  if (step === 'luister') return startSession({keys: listenKeys(q), sq: q, step: 'luister', intros: false});
  if (step === 'lees') return READ[q] ? openRead(q) : toast('Voor dit plein is er nog geen tekst.');
  if (step === 'gebruik') return openUse(q);
}
let READING = null;
function readHTML(text) {
  return esc(text).split(/(\s+)/).map(tok => {
    const core = tok.replace(/^[^\p{L}’']+|[^\p{L}’']+$/gu, '');
    const id = core && FORM_IX[norm(core)];
    return id ? tok.replace(core, `<button class="rw" data-act="word" data-id="${id}">${core}</button>`) : tok;
  }).join('');
}
function openRead(q) {

  openOverlay('read', `<button class="iconbtn" data-act="overlay-close" data-id="read" aria-label="Sluiten">✕</button><span class="small">Lees · ${esc(sq.name)}</span>`, `<div class="stack">
    ${coachTip('lees', 'Lees de tekst. Tik op een groen onderlijnd woord voor de woordkaart. Tik op de luidspreker om de hele tekst te horen. Beantwoord dan de drie vragen: 2 van de 3 juist en dit gildehuis is klaar.')}
    <div class="row" style="align-items:flex-start">${speakBtn(R.text)}<h1 style="flex:1">${esc(R.title)}</h1></div>
    <div class="readtext nl">${readHTML(R.text)}</div>
    <button class="en-hidden" data-act="reveal-en" data-en-text="${esc(R.en)}" style="align-self:flex-start">Waarover gaat het? (Engels)</button>
    <div class="eyebrow">Drie vragen</div>
    ${R.qs.map((x, i) => `<div class="card stack" style="gap:8px" id="rq-${i}"><div style="font-weight:600">${i + 1}. ${esc(x.q)}</div><div class="opts">${x.o.map((o, j) => `<button class="opt" data-act="read-ans" data-i="${i}" data-j="${j}">${esc(o)}</button>`).join('')}</div></div>`).join('')}
    <div id="read-end"></div>

}
function readAnswer(i, j) {
  if (!READING || READING.ans[i] !== undefined) return;
  const R = READ[READING.q]; const ok = R.qs[i].a === j; READING.ans[i] = ok;
  const box = $('#rq-' + i); $$('.opt', box).forEach((b, k) => { b.disabled = true; if (k === R.qs[i].a) b.classList.add('right'); else if (k === j) b.classList.add('wrong'); });
  if (Object.keys(READING.ans).length === R.qs.length) {

    $('#read-end').innerHTML = `<div class="card soft stack" style="gap:8px"><div class="big-num">${n} / ${R.qs.length}</div><div>${pass ? 'Goed gelezen: dit gildehuis is klaar.' : 'Lees de tekst nog eens en probeer opnieuw.'}</div><button class="btn block" data-act="${pass ? 'read-close' : 'read-again'}" data-q="${READING.q}">${pass ? 'Terug naar het plein' : 'Opnieuw'}</button></div>`;

/* ---------- FLASHCARDS: simple or full, swipe right = I know it ---------- */
const MODAL_EN = new Set(['can', 'may', 'must', 'shall', 'will', 'should']);
function enBase(l) {
  const parts = String(l.en || '').replace(/\(.*?\)/g, '').split(/[;,]/).map(t => t.trim()).filter(Boolean);
  if (!parts.length) return null;
  if (MODAL_EN.has(parts[0])) return parts[0];
  const to = parts.find(p => p.startsWith('to ')); return to ? to.slice(3) : parts[0];
}
function en3(base) {
  const [w, ...rest] = base.split(' '); let x;
  if (MODAL_EN.has(w)) x = w; else if (w === 'be') x = 'is'; else if (w === 'have') x = 'has'; else if (/(s|sh|ch|x|z|o)$/.test(w)) x = w + 'es'; else if (/[^aeiou]y$/.test(w)) x = w.slice(0, -1) + 'ies'; else x = w + 's';

  const f = vForms(l); const b = enBase(l); const p = PERS[rnd(PERS.length)];
  const nl = `${p[0]} ${f[p[2]]}${f.sep ? ' ' + f.sep : ''}`;
  if (!b) return {nl, en: l.d};
  const [w, ...rest] = b.split(' ');
  let en;
  if (w === 'be') en = p[1] + ' ' + (p[1] === 'I' ? 'am' : ['he', 'she'].includes(p[1]) ? 'is' : 'are') + (rest.length ? ' ' + rest.join(' ') : '');
  else en = p[1] + ' ' + (['he', 'she'].includes(p[1]) ? en3(b) : b);
  return {nl, en};
}

function registerSW() {

  navigator.serviceWorker.register('sw.js').then(reg => {
    const offer = w => { if (w && navigator.serviceWorker.controller) updateToast(w); };
    if (reg.waiting) offer(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') offer(w); }); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
}

  text = String(text || '').replace(/\r\n?/g, '\n');
  const i = text.indexOf('EDZ-VERSLAG v1');
  if (i < 0) return {error: 'Ik vind geen verslag in deze tekst.', hint: 'Kopieer het hele blok, van EDZ-VERSLAG v1 tot EDZ-EINDE. Vraag Claude anders: ‘geef me het verslag’.'};
  let body = text.slice(i + 'EDZ-VERSLAG v1'.length);
  const e = body.indexOf('EDZ-EINDE'); if (e >= 0) body = body.slice(0, e);
  body = body.replace(/^\s*```[a-z]*\s*$/gim, '');
  const a = body.indexOf('{'), b = body.lastIndexOf('}');
  if (a < 0 || b < a) return {error: e < 0 ? 'Het verslag is niet volledig: het einde ontbreekt.' : 'Het verslag is leeg.', hint: 'Kopieer het hele blok, tot en met EDZ-EINDE. ' + ASK_JSON + '.'};
  const raw = body.slice(a, b + 1);
  let d = null;
  try { d = JSON.parse(raw); } catch (err) {
    try { d = JSON.parse(raw.replace(/[“”„‟″]/g, '"').replace(/[‘’‚‛′]/g, "'")); } catch (err2) { d = null; }
  }
  if (!d || typeof d !== 'object' || Array.isArray(d)) return {error: 'Het verslag is geen geldige JSON.' + (e < 0 ? ' Het einde (EDZ-EINDE) ontbreekt ook.' : ''), hint: ASK_JSON + '.'};
  return {data: cleanReport(d), hash: hashText(JSON.stringify(d))};
}

async function saveFile(name, text, type) {

    const file = new File([text], name, {type});
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); return 'shared'; }
  } catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); return 'downloaded';
}

(function () {
  let timer = null, tip = null, fired = false;
  const hide = () => { if (tip) { tip.remove(); tip = null; } };
  document.addEventListener('pointerdown', e => {
    hide(); fired = false;
    const el = e.target.closest('[data-en]'); if (!el || !el.dataset.en) return;
    timer = setTimeout(() => {
      fired = true; tip = document.createElement('div'); tip.id = 'tip'; tip.textContent = el.dataset.en; document.body.appendChild(tip);
      const r = el.getBoundingClientRect(); const tw = tip.offsetWidth;
      tip.style.left = Math.max(8, Math.min(innerWidth - tw - 8, r.left + r.width / 2 - tw / 2)) + 'px';
      tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + 'px';
      setTimeout(hide, 2200);
    }, 480);
  }, {passive: true});
  ['pointerup', 'pointercancel', 'pointermove'].forEach(t => document.addEventListener(t, e => { if (t === 'pointermove' && Math.abs(e.movementX) + Math.abs(e.movementY) < 4) return; clearTimeout(timer); }, {passive: true}));
  document.addEventListener('click', e => { if (fired) { fired = false; e.stopPropagation(); e.preventDefault(); } }, true);
  document.addEventListener('contextmenu', e => { if (e.target.closest('[data-en]')) e.preventDefault(); });
})();

    case 'sheet-close': closeSheet(); break;
    case 'fclose': closeFeed(); break;
    case 'faudio': S.settings.autoAudio = !S.settings.autoAudio; el.textContent = S.settings.autoAudio ? 'Geluid aan' : 'Geluid uit'; Store.mark('state'); break;
    case 'fans': feedAnswer(d.fid, d.v); break;
    case 'freveal': { const sec = el.closest('.fcard'); $('.fback', sec).hidden = false; el.hidden = true; const g = $('.fgrade', sec); if (g) g.hidden = false; break; }
    case 'fknew': { const c = FC[d.fid]; if (c && !c.done) { c.done = true; grade('w:' + c.l.id + ':rec', d.ok === '1'); } $$('[data-act="fknew"]', el.closest('.fcard')).forEach(b => { b.disabled = true; if (b === el) b.style.outline = '2px solid var(--gold)'; }); break; }
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', {bubbles: true})); }
  if (e.key === 'Escape') { if ($('#sheetback')) closeSheet(); }
});
document.addEventListener('submit', e => { if (e.target.id === 'ex-form') { e.preventDefault(); submitAnswer($('#ex-in').value); } });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ex-in') { const er = $('#ex-err'); if (er) er.hidden = true; }
  if (t.id === 'wsearch') { WQ = t.value; $('#wlist').innerHTML = wordList(); }
  if (t.id === 'nsearch') { NQ = t.value; naslagFilter(); }
  if (t.id === 'set-rate') { S.settings.rate = Number(t.value); $('#rate-out').textContent = t.value; Store.mark('state'); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'set-voice') { S.settings.voice = t.value; Store.mark('state'); Audio.say('Hallo, ik ben je stem.'); }
  if (t.id === 'set-cap') { S.settings.cap = Number(t.value); Store.mark('state'); }
  if (t.id === 'set-start') { S.settings.startView = t.value; Store.mark('state'); }
  if (t.id === 'set-tour') { S.settings.tourOnStart = t.checked; Store.mark('state'); }
  if (t.id === 'set-tips') { S.settings.tips = t.checked; Store.mark('state'); render(); }
  if (t.id === 'set-test') { S.settings.test = t.checked; Store.mark('state'); render(); toast(t.checked ? 'Testmodus aan: alles is open' : 'Testmodus uit: pleinen gaan in volgorde open'); }
  if (t.id === 'imp-file' && t.files[0]) importData(t.files[0]);
});

/* ===== INIT ===== */
(function init() {
  let first = false; try { first = !localStorage.getItem(LS_KEY) && !localStorage.getItem(LS_OLD); } catch (e) {}
  Store.loadLocal(); Audio.load();
  if (first) Store.persist();
  registerSW();
  render();
  setTimeout(() => { if (TAB === 'ik') render(); }, 800);
  if (location.hash === '#feed') { openFeed(); return; }
  if (S.settings.tourOnStart || (!S.coach.tour && !S.savedAt)) openTour(0); else if (S.settings.startView !== 'pad' && !$('.overlay')) openFeed();
})();


</script>
</body>
